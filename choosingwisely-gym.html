  const q=Q.cur, st=topicStats();
  $('#main').innerHTML=`<div class="stack fade">
  <section class="sheet"><h2>Quiz</h2><p class="lede">One question at a time, mixing concept questions and calculations. It starts easy and moves up a level after 3 right in a row. After a miss, the next question is a similar one on the same topic, and weak topics come up more often.</p>
   <div class="row" style="margin-top:10px">
    <div class="seg"><button aria-pressed="${Q.mode==='adaptive'}" data-m="adaptive">Everything</button><button aria-pressed="${Q.mode==='unit'}" data-m="unit">One week</button><button aria-pressed="${Q.mode==='topic'}" data-m="topic">One topic</button></div>
    ${Q.mode==='topic'?`<select id="qtopic" style="width:auto" aria-label="topic">${TOPICS.map(t=>`<option value="${t.id}" ${t.id===Q.topic?'selected':''}>${t.name}</option>`).join('')}</select>`:''}
    ${Q.mode==='unit'?`<select id="qunit" style="width:auto" aria-label="week">${UNITS.map(u=>`<option value="${u.wk}" ${u.wk===Q.unit?'selected':''}>Week ${u.wk}: ${esc(u.title)}</option>`).join('')}</select>`:''}
   </div>
   <div class="scoreline" style="margin-top:10px"><span>Session <b>${Q.sess.r}/${Q.sess.r+Q.sess.w}</b></span><span>Level <b>${Q.level}</b> of 3</span><span>Streak <b>${Q.streak}</b></span><span>Weak: <b>${st.filter(s=>s.weak).map(s=>s.n).join(', ')||'none yet'}</b></span></div></section>
  ${q?`<section class="sheet" id="qcard"><div class="qmeta"><span class="pill">${TNAME[q.t]}</span><span class="pill lvl">${'●'.repeat(q.d)}${'○'.repeat(3-q.d)} level ${q.d}</span><span class="pill lvl">${q.kind==='calc'?'calculation':'concept'}</span>${Q.lastWrong&&q.t===Q.lastWrong.t?'<span class="pill off">similar question</span>':''}</div>
   <div style="margin-top:12px">${q.kind==='mc'?`<p><b>${q.m.q}</b></p><div class="choices">${Q.order.map((i,k)=>`<button data-c="${i}"><span class="k">${'ABCD'[k]}</span><span>${q.m.o[i]}</span></button>`).join('')}</div>`:probHTML(Q.P,'q')}</div>
   <div class="row" style="margin-top:12px"><button class="btn primary" id="qsubmit">Check answer</button><button class="btn ghost" id="qskip">Skip</button></div>
   <div id="qfb" style="margin-top:12px"></div></section>`:'<section class="sheet">No questions match these filters.</section>'}</div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{Q.mode=b.dataset.m; if(Q.mode==='topic'&&!Q.topic)Q.topic='bayes'; if(Q.mode==='unit'&&!Q.unit)Q.unit=UNITS[UNITS.length-1].wk; Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;R.quiz();});
  const su=$('#qunit'); if(su) su.onchange=()=>{Q.unit=+su.value;Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;R.quiz();};
  const sel=$('#qtopic'); if(sel) sel.onchange=()=>{Q.topic=sel.value;Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;R.quiz();};
  if(!q) return;
  const card=$('#qcard'); let pickc=null;
  if(q.kind==='mc') $$('.choices button[data-c]',card).forEach(b=>b.onclick=()=>{if(Q.answered)return;$$('.choices button[data-c]',card).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pickc=+b.dataset.c;});
  else wireChoices(card);
  $('#qskip').onclick=()=>{Q.seen.add(q.id);Q.cur=null;Q.lastWrong=null;R.quiz();};
  $('#qsubmit').onclick=()=>{
    if(Q.answered){Q.cur=null;R.quiz();return;}
    let right, fb;
    if(q.kind==='mc'){ if(pickc===null){toast('Pick an answer first');return;} right=pickc===q.m.a;
      $$('.choices button[data-c]',card).forEach(b=>{const i=+b.dataset.c; if(i===q.m.a)b.classList.add('right'); else if(i===pickc)b.classList.add('wrong');});
      fb=`<div class="verdict ${right?'ok':'bad'} fade"><strong class="${right?'ok':'bad'}">${right?'Correct.':'Not quite.'}</strong>${right?'':`<p style="margin:6px 0 0"><b>Answer:</b> ${q.m.o[q.m.a]}</p>`}<p style="margin:6px 0 0">${q.m.e}</p>${right?'':`<p class="small" style="margin:8px 0 0">Next up is a similar question. If this topic stays shaky, <a href="#" data-go="learn:${q.t}">re-read ${TNAME[q.t]}</a>.</p>`}</div>`; }
    else { if(!$$('input[data-pp]',card).some(i=>i.value.trim())&&!$('.choices button.sel',card)){toast('Enter an answer first');return;}
      const g=gradeProb(Q.P,card); right=g.allOk; fb=solutionHTML(Q.P,g)+(right?'':`<p class="small" style="margin:8px 0 0">Next up is a fresh problem of the same kind. <a href="#" data-go="learn:${q.t}">Re-read ${TNAME[q.t]}</a> if the steps didn't click.</p>`); }
    Q.answered=true; Q.seen.add(q.id); bump(q.t,right,q.kind==='calc'?q.g:null);
    if(right){Q.sess.r++;Q.streak++;Q.lastWrong=null;if(Q.streak>=3&&Q.level<3){Q.level++;Q.streak=0;}}
    else{Q.sess.w++;Q.streak=0;Q.lastWrong=q;}
    $('#qfb').innerHTML=fb; $('#qsubmit').textContent='Next question →'; $('#qskip').hidden=true; $$('input',card).forEach(i=>i.readOnly=true); $('#qsubmit').focus();
  };
}

/* ---------- EXAMS ---------- */
const EXDEF={
 e2:{title:'Mock Exam 2',when:'Mon Nov 2',minutes:50,topics:SCOPES.e2.topics,
   note:'New questions on the Exam 2 material (weeks 6–9 plus the cumulative expected-utility and utility-scale techniques). Calculations are auto-checked; for short answers you compare against the model answer and rubric and enter your own score. Calculator allowed. The real exam\'s length and point split aren\'t in the course materials; this uses 50 minutes and 50 points.',
   parts:[{n:1,title:'Expected utility / utility scales',pts:8,type:'calc',gens:['util_indiff','util_solve','ev_insurance','ev_twoact','util_threshold']},
     {n:2,title:'Probability',pts:8,type:'calc',gens:['prob_cards','prob_atleast','prob_seq','cond_prob','norcross']},
     {n:3,title:'Bayes',pts:10,type:'calc',gens:['bayes_test','hume','doom','bayes_urn']},
     {n:4,title:'Concepts',pts:4,type:'mc',count:4},
     {n:5,title:'Argument in premise–conclusion form',pts:10,type:'sa',kinds:['pc']},
     {n:6,title:'Objection + reply, or explanation',pts:10,type:'sa',kinds:['or','ex']}]},
 e1:{title:'Exam 1 review mock',when:'taken Sep 28',minutes:50,topics:SCOPES.e1.topics,
   note:'Same format on the Exam 1 topics. Useful review if the final is cumulative (the syllabus doesn\'t say).',
   parts:[{n:1,title:'Decision table: dominance / expected value / Oddie',pts:8,type:'calc',gens:['ev_twoact','dominance','oddie','ev_breakeven']},
     {n:2,title:'QALY',pts:8,type:'calc',gens:['qaly_annual','qaly_onetime','qaly_maxtto','qaly_scores']},
     {n:3,title:'Utility weighting or collective action',pts:10,type:'calc',gens:['te_global','kagan','util_solve']},
     {n:4,title:'Concepts',pts:4,type:'mc',count:4},
     {n:5,title:'Argument in premise–conclusion form',pts:10,type:'sa',kinds:['pc']},
     {n:6,title:'Objection + reply, or explanation',pts:10,type:'sa',kinds:['or','ex']}]},
};
EXDEF.e2.parts[1].gens.push('sim_frac'); EXDEF.e2.parts[2].gens.push('bb_bayes');
function weightedPick(arr,topicOf){const w=arr.map(x=>{const s=S.stats[topicOf(x)]||{r:0,w:0};return ((s.w+1)/(s.r+1))*(FOCUS[topicOf(x)]||1);});let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function newAttempt(k){const E=EXDEF[k]; const items=E.parts.map(p=>{
  if(p.type==='calc'){const g=weightedPick(p.gens,x=>GENS[x].topic); return {g,topic:GENS[g].topic,P:GENS[g].gen(pick([2,2,3]))};}
  if(p.type==='mc'){const qs=shuffle(MCQ.map((m,i)=>i).filter(i=>E.topics.includes(MCQ[i].t)&&MCQ[i].d>=2)).slice(0,p.count); return {qs:qs.map(i=>({i,order:shuffle(MCQ[i].o.map((_,j)=>j))}))};}
  const cand=SA.filter(s=>E.topics.includes(s.t)&&p.kinds.includes(s.type)); const s=weightedPick(cand,x=>x.t); return {sa:s.id,topic:s.t};});
  S.exams[k]={items,a:{},score:{},graded:false,left:E.minutes*60,at:Date.now()}; save();}
const TIMERS={};
R.exams=function(){
  const tot=k=>{const e=S.exams[k]; if(!e||!e.graded) return null; let t=0; EXDEF[k].parts.forEach((p,pi)=>{const v=parseFloat(e.score[pi]); if(!isNaN(v)) t+=Math.min(v,p.pts);}); return t;};
  const card=k=>{const E=EXDEF[k],t=tot(k);return `<section class="sheet stack" style="gap:8px"><div class="lessonhead"><h3>${E.title}</h3><span class="src">${E.when} · ${t!=null?`<b>${t}/50</b> last graded`:'not graded yet'}</span></div><p class="small muted" style="margin:0">${E.note}</p><div class="row"><button class="btn primary" data-go="mock:${k}">Open</button></div></section>`;};
  const fd=daysTo('2026-12-15');
  $('#main').innerHTML=`<div class="stack fade">
  <section class="sheet"><h2>Exams</h2><p class="lede">Timed practice in the course's format: technical questions like the homework, plus short written answers. Each attempt generates new questions, weighted toward your weak topics.</p></section>
  ${card('e2')}
  <section class="sheet stack" style="gap:8px"><div class="lessonhead"><h3>Final exam</h3><span class="src">${FINAL.date}, ${FINAL.time}, ${FINAL.where} (syllabus)${fd>0?` · ${fd} days`:''}</span></div>
    <p class="small muted" style="margin:0">Waiting on the rest of the semester. The schedule is blank after Oct 23 and the final's study guide isn't posted. Once the remaining units are added, a cumulative mock final and a day-by-day plan will be built here, weighted toward your weak topics. Tell Claude when the study guide is up.</p></section>
  ${card('e1')}</div>`;
};
R.mock=function(k){k=EXDEF[k]?k:'e2'; R.mock.k=k; if(!S.exams[k]||!S.exams[k].items) newAttempt(k); renderExam(k);};
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function renderExam(k){
  const E=EXDEF[k], st=S.exams[k], g=st.graded;
  $('#main').innerHTML=`<div class="stack fade">
  <section class="sheet"><div class="row" style="margin-bottom:8px"><button class="btn ghost" data-go="exams">← All exams</button></div><h2>${E.title}</h2><p class="lede">${E.note}</p></section>
  <section class="sheet examhead"><div><div class="timer ${st.left<300?'low':''}" id="tm">${fmtT(st.left)}</div><span class="small muted">${E.minutes}-minute timer · 50 points</span></div>
   <div class="row"><button class="btn primary" id="tmgo">${TIMERS[k]?'Pause':'Start timer'}</button><button class="btn ghost" id="tmreset">Reset timer</button>
   <button class="btn" id="exgrade">${g?'Re-grade':'Finish & grade'}</button><button class="btn ghost" id="exnew">New attempt</button></div></section>
  ${E.parts.map((p,pi)=>partHTML(k,p,pi)).join('')}
  <section class="sheet" id="exsum">${g?summaryHTML(k):'<p class="muted" style="margin:0">Press <b>Finish &amp; grade</b> when you\'re done. Parts 1–4 are auto-checked. For parts 5 and 6, tick the rubric against the model answer and your score fills in.</p>'}</section></div>`;
  // restore + persist answers
  E.parts.forEach((p,pi)=>{const root=$('#part'+pi);
    if(p.type==='calc'){ wireChoices(root,(key,v)=>{st.a[pi+':'+key]=v;save();}); $$('input[data-pp]',root).forEach(inp=>{inp.value=st.a[pi+':n'+inp.dataset.pp]||'';inp.addEventListener('input',()=>{st.a[pi+':n'+inp.dataset.pp]=inp.value;save();});});
      Object.keys(st.a).filter(x=>x.startsWith(pi+':c')).forEach(x=>{const b=$(`.choices button[data-pp="${x.split(':c')[1]}"][data-o="${st.a[x]}"]`,root); if(b) b.classList.add('sel');});
      if(g){ const r=gradeProb(st.items[pi].P,root); root.querySelector('.solbox').innerHTML=solutionHTML(st.items[pi].P,r);} }
    if(p.type==='mc'){ st.items[pi].qs.forEach((q,qi)=>{const box=$(`[data-mq="${qi}"]`,root); const chosen=st.a[pi+':m'+qi];
      $$('button',box).forEach(b=>{ if(+b.dataset.c===chosen) b.classList.add('sel'); b.onclick=()=>{ if(st.graded) return; $$('button',box).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); st.a[pi+':m'+qi]=+b.dataset.c; save(); }; });
      if(g){const m=MCQ[q.i]; $$('button',box).forEach(b=>{const c=+b.dataset.c; if(c===m.a) b.classList.add('right'); else if(c===chosen) b.classList.add('wrong');});} }); }
    if(p.type==='sa'){ const ta=$('textarea',root); ta.value=st.a[pi+':t']||''; ta.addEventListener('input',()=>{st.a[pi+':t']=ta.value;save();});
      $$('input[data-r]',root).forEach(c=>{c.checked=!!(st.a[pi+':r']||{})[c.dataset.r]; c.addEventListener('change',()=>{const m=st.a[pi+':r']=st.a[pi+':r']||{}; m[c.dataset.r]=c.checked; const it=SA.find(s=>s.id===st.items[pi].sa); const scored=it.pts.filter(x=>!/bonus/i.test(x)).length; const n=Math.min(scored,$$('input[data-r]:checked',root).length); st.score[pi]=Math.round(p.pts*n/scored*2)/2; save(); $('[data-score="'+pi+'"]',root).value=st.score[pi]; $('#exsum').innerHTML=summaryHTML(k);});});
      const sc=$('[data-score]',root); if(sc) sc.addEventListener('input',()=>{st.score[pi]=sc.value;save();$('#exsum').innerHTML=summaryHTML(k);}); }
  });
  $('#tmgo').onclick=()=>{if(TIMERS[k]){clearInterval(TIMERS[k]);TIMERS[k]=null;$('#tmgo').textContent='Resume';}else{TIMERS[k]=setInterval(()=>{st.left=Math.max(0,st.left-1);save();const t=$('#tm');if(t&&TAB==='mock'&&R.mock.k===k){t.textContent=fmtT(st.left);t.classList.toggle('low',st.left<300);}if(st.left===0){clearInterval(TIMERS[k]);TIMERS[k]=null;toast("Time's up: pens down");}},1000);$('#tmgo').textContent='Pause';}};
  $('#tmreset').onclick=()=>{clearInterval(TIMERS[k]);TIMERS[k]=null;st.left=E.minutes*60;save();renderExam(k);};
  $('#exgrade').onclick=()=>{autoGrade(k);st.graded=true;save();renderExam(k);$('#exsum').scrollIntoView({behavior:'smooth'});};
  const nb=$('#exnew'); nb.onclick=()=>{ if(nb.dataset.arm){clearInterval(TIMERS[k]);TIMERS[k]=null;newAttempt(k);renderExam(k);toast('New questions generated');} else {nb.dataset.arm='1';nb.textContent='Click again to discard this attempt';setTimeout(()=>{if(nb.isConnected){delete nb.dataset.arm;nb.textContent='New attempt';}},4000);} };
}
function partHTML(k,p,pi){
  const st=S.exams[k], it=st.items[pi], g=st.graded; let body='';
  if(p.type==='calc') body=`${probHTML(it.P,'x'+pi)}<div class="solbox" style="margin-top:10px"></div>`;
  else if(p.type==='mc') body=it.qs.map((q,qi)=>{const m=MCQ[q.i];return `<div class="stack" style="gap:6px;margin-bottom:12px" ><p style="margin:0"><b>(${'abcd'[qi]})</b> ${m.q}</p><div class="choices" data-mq="${qi}">${q.order.map((i,j)=>`<button data-c="${i}"><span class="k">${'ABCD'[j]}</span><span>${m.o[i]}</span></button>`).join('')}</div>${g?`<p class="small muted" style="margin:0">${m.e}</p>`:''}</div>`;}).join('');
  else { const s=SA.find(x=>x.id===it.sa);
    body=`<p><b>${esc(s.q)}</b></p><p class="small muted">${FORMAT[s.type].tip}</p><textarea rows="9" placeholder="Your answer"></textarea>
    ${g?`<div class="key" style="margin-top:10px"><b>Model answer</b><div class="modelans">${esc(s.model)}</div><b>Rubric: tick what your answer actually says</b><ul class="rubric">${s.pts.map((x,i)=>`<li><label><input type="checkbox" data-r="${i}"> <span>${esc(x)}</span></label></li>`).join('')}</ul>
      <div class="selfscore" style="margin-top:8px"><label for="sc-${k}-${pi}">Your score</label><input type="text" inputmode="decimal" id="sc-${k}-${pi}" data-score="${pi}" value="${esc(st.score[pi]??'')}"> / ${p.pts}</div></div>`:''}`; }
  return `<section class="sheet" id="part${pi}"><div class="qhead"><h3>${p.n}) ${esc(p.title)}</h3><span class="pts">[${p.pts} pts]</span></div>${body}</section>`;
}
function autoGrade(k){const E=EXDEF[k],st=S.exams[k]; E.parts.forEach((p,pi)=>{const it=st.items[pi];
  if(p.type==='calc'){const root=$('#part'+pi); const r=gradeProb(it.P,root,false); st.score[pi]=Math.round(p.pts*r.frac*2)/2; if(!st.graded) bump(it.topic,r.allOk,it.g);}
  if(p.type==='mc'){let s=0; it.qs.forEach((q,qi)=>{const ok=st.a[pi+':m'+qi]===MCQ[q.i].a; if(ok) s++; if(!st.graded) bump(MCQ[q.i].t,ok);}); st.score[pi]=s;}
  if(p.type==='sa'&&!(st.a[pi+':t']||'').trim()) st.score[pi]=0; });}
function partTopic(k,pi){const p=EXDEF[k].parts[pi],it=S.exams[k].items[pi]; if(p.type==='calc') return it.topic; if(p.type==='sa') return it.topic; const ts=it.qs.map(q=>MCQ[q.i].t); return ts[0];}
function summaryHTML(k){const E=EXDEF[k],st=S.exams[k]; let tot=0; const rows=E.parts.map((p,pi)=>{const v=parseFloat(st.score[pi]); const s=isNaN(v)?null:Math.min(v,p.pts); if(s!=null) tot+=s; return {p,pi,s};});
  const review=rows.filter(r=>r.s==null||r.s/r.p.pts<.7);
  return `<h3>Score</h3><div class="row" style="align-items:baseline;gap:12px;margin:6px 0 10px"><span class="total">${tot}</span><span class="muted">/ 50 · ${Math.round(tot*2)}%</span></div>
  ${rows.map(r=>`<div class="statrow"><span class="lbl">Q${r.p.n} ${esc(r.p.title)}</span><div class="bar"><i style="width:${r.s==null?0:100*r.s/r.p.pts}%;${r.s!=null&&r.s/r.p.pts<.7?'background:var(--fail)':''}"></i></div><span class="num">${r.s==null?'score?':r.s+'/'+r.p.pts}</span></div>`).join('')}
  <h4>What to review</h4>${review.length?`<ul style="margin:0;padding-left:18px">${review.map(r=>{const t=partTopic(k,r.pi);return `<li>Q${r.p.n} (${esc(r.p.title)}): ${r.s==null?'tick the rubric above to score it. ':''}re-read <a href="#" data-go="learn:${t}">${TNAME[t]}</a>, then ${r.p.type==='calc'?`do three <a href="#" data-go="calc:${t}">Calculation Lab</a> problems`:r.p.type==='sa'?`rewrite it in the <a href="#" data-go="sa:${t}">Short Answer Lab</a>`:`run a <a href="#" data-go="quiz:${t}">topic quiz</a>`}.</li>`;}).join('')}</ul>`:'<p class="ok"><b>Every part is at 70% or above.</b> Start a new attempt, or spend the time on the quiz.</p>'}`;}

/* boot */
(function(){const h=(location.hash||'').slice(1); go(R[h]&&h!=='mock'?h:'home');})();
