/* =========================================================

   (slides L1–L19, HW1–HW5 + keys, Exam 1 study guide, assigned readings)
   ========================================================= */
const EXAM_DATE = "2026-11-02"; // syllabus + schedule: "11.02: Exam 2"
const TOPICS = [
  {id:"pascal", name:"Pascal's Wager", exam:1},
  {id:"ev", name:"Expected value & utility scales", exam:0},
  {id:"moral", name:"Moral uncertainty (Oddie)", exam:1},
  {id:"qaly", name:"QALY", exam:1},
  {id:"te", name:"Transformative experience", exam:1},
  {id:"collective", name:"Collective action (Kagan)", exam:1},
  {id:"harms", name:"Adding harms (Norcross)", exam:2},
  {id:"prob", name:"Probability rules", exam:2},
  {id:"bayes", name:"Hume, miracles & Bayes", exam:2},
  {id:"doomsday", name:"Doomsday (Leslie)", exam:2},
];
const TNAME = Object.fromEntries(TOPICS.map(t=>[t.id,t.name]));
// exam:0 = cumulative technique ("semi-cumulative: expected utility; setting utility scales" — slide L14)
const SCOPES = {
  e2:{label:"Exam 2 (Nov 2)", topics:["ev","harms","prob","bayes","doomsday"]},
  e1:{label:"Exam 1 topics", topics:["pascal","ev","moral","qaly","te","collective"]},
  all:{label:"Everything", topics:TOPICS.map(t=>t.id)},
};

/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function f(x,d=4){ if(!isFinite(x)) return String(x); if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x)); let s=Number(x).toFixed(d); s=s.replace(/0+$/,'').replace(/\.$/,''); return s; }
function fp(x){ // probabilities: keep enough digits for tiny numbers
  if(x!==0 && Math.abs(x)<0.001) return Number(x).toPrecision(3);
  return f(x,4);
}
const money=x=>(x<0?"−$":"$")+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseAns(s){
  if(s==null) return NaN; s=String(s).trim().replace(/[$,\s]/g,"").replace(/−/g,"-");
  if(!s) return NaN;
  let pct=false; if(s.endsWith("%")){pct=true;s=s.slice(0,-1)}
  let v;
  const m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if(m) v=parseFloat(m[1])/parseFloat(m[2]); else if(/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) v=parseFloat(s); else return NaN;
  return pct? v/100 : v;
}
function close(user,ans,tol){
  if(!isFinite(user)) return false;
  const t = tol!=null? tol : Math.max(Math.abs(ans)*0.01, 0.0006);
  return Math.abs(user-ans)<=t;
}
function dtable(cols,rows){ // cols: header labels; rows: [label,...cells]
  return `<div class="tablewrap"><table class="dt"><thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* =========================================================
   LESSONS (one-page sheets, in Peeters' notation)
   ========================================================= */
const LESSONS = {
formula:{title:"Formula sheet", src:"Exam 1 study guide · slides L1, L5, L7–L10, L13, L15–L19", html:`
<div class="sec"><h3>Expected value / expected utility</h3>
<div class="formula">EV[A] = Pr(C1|A)·V(C1|A) + Pr(C2|A)·V(C2|A) + … + Pr(Cn|A)·V(Cn|A)</div>
<p>Rule (slide L1–L2, "Claim3"): rationality requires performing the action with the highest expected value.</p></div>
<div class="sec"><h3>Utility from stated preference</h3>
<div class="formula">Indifferent between C1 and C2  →  EU[C1] = EU[C2]
Prefers C1 to C2             →  EU[C1] > EU[C2]
You may fix two utilities (e.g. best = 1, worst = 0) and solve for the rest.</div></div>
<div class="sec"><h3>Dominance (slide L1)</h3>
<p>A1 dominates A2 iff for every state the outcome of A1 is at least as good as A2's, and for some state it is better.</p></div>
<div class="sec"><h3>Oddie</h3><div class="formula">E[Experiment] = p(g − l) + (1 − p)g = g − p·l      E[Not] = 0
Experiment just in case  g ≥ p·l</div></div>
<div class="sec"><h3>QALY</h3><div class="formula">Standard gamble: indifferent at p cure / (1−p) death  →  QALY = p
Time trade-off: 10 yrs in condition ≡ t yrs full health  →  QALY = t/10
QALY gained = (new score − old score) × years  (+ extra years × their score)
Cost per QALY = [cost of intervention] / [QALY gained]   (lower = prioritized)</div></div>
<div class="sec"><h3>Pettigrew: global utility</h3><div class="formula">U[S|A1] = w_past·U_past[S|A1] + w_present·U_present[S|A1] + w_future·U_future[S|A1]
(the w's sum to 1)</div></div>
<div class="sec"><h3>Kagan (slide L13)</h3><div class="formula">B = bad effect, g = individual good, n = # of acts, T = threshold
Claim1: B > n·g      If threshold reached, effect = T·B/n      Pr(your act triggers) = 1/T
EU(act) = g − (1/T)(T·B/n) = g − B/n  &lt; 0</div></div>
<div class="sec"><h3>Probability (slides L15–L17)</h3><div class="formula">Pr(A) = # A possibilities / # total     (all equally likely)
Pr(A or B) = Pr(A) + Pr(B) − Pr(A and B)     (= Pr(A)+Pr(B) if exclusive)
Pr(A and B) = Pr(A)·Pr(B|A) = Pr(B)·Pr(A|B)  (= Pr(A)·Pr(B) if independent)
Pr(at least one) = 1 − Pr(none)
Pr(A|B) = Pr(A and B) / Pr(B)</div></div>
<div class="sec"><h3>Bayes's theorem (slide L18)</h3><div class="formula">Pr(T|E) = Pr(E|T)·Pr(T) / [ Pr(E|T)·Pr(T) + Pr(E|not T)·Pr(not T) ]</div></div>`},

pascal:{title:"Pascal's Wager", topic:"pascal", src:"8.24–8.28 · slides L1–L3 · Jackson 2021 · Hájek 2003 §1–3, §4.2", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Decision table</dt><dd>Rows are your actions, columns are states of the world, cells are outcomes.</dd>
<dt>Dominance</dt><dd>A1 dominates A2 iff in every state A1's outcome is at least as good as A2's, and in some state it is better. Claim: it is irrational to perform a dominated action.</dd>
<dt>Expected value</dt><dd>Probability-weighted average of an act's outcomes. Used when no act dominates.</dd>
<dt>Mixed strategy</dt><dd>An act that randomizes between pure acts, e.g. "flip a fair coin; believe iff heads."</dd>
<dt>Many Gods objection</dt><dd>There are many possible gods that damn the believers of rival religions, so Pascal's 2×2 table is too simple.</dd></dl></div>
<div class="sec"><h3>The arguments</h3>
<p><b>Argument #1 (dominance), slide L1:</b></p>
<div class="prem">(P1) Believing in God dominates not believing in God.<br>(P2) If A1 dominates A2 it is irrational to do A2 instead of A1.<br>(C) It is irrational not to believe in God.</div>
<p>Objection on the slide: "Pascal has the outcomes wrong!" If there is no God, believing costs you something (finite loss) and not believing gains you something (finite gain), so belief does not dominate. That is why Pascal needs expected value.</p>
${dtable(["God (p)","No God (1−p)"],[["Believe","+∞","−f1"],["Don't believe","−∞","+f2"]])}
<p><b>Argument #2 (expected value), slide L2:</b></p>
<div class="prem">Claim1: P(God) &gt; 0.<br>Claim2: EV[Believing] &gt; EV[Not Believing]<br>&nbsp;&nbsp;EV[Believing] = p(God)(+∞) + p(No God)(−f1)<br>&nbsp;&nbsp;EV[Not believing] = p(God)(−∞) + p(No God)(+f2)<br>Claim3: Rationality requires performing the action with the highest expected value.<br>Hence: Rationality requires belief in God.</div>
<p>The power of the argument: any positive p times ∞ is ∞, so you never need to know how likely God is.</p></div>
<div class="sec"><h3>Objections and replies</h3><ol>
<li><b>Many Gods (L2).</b> Split the states into G1 (only Christian worshippers saved), G2 (only Islamic worshippers saved), G3 (everyone saved), ~G. Then every belief act has −∞ in some column, so the expected values are not well-defined and cannot be ranked.
${dtable(["G1","G2","G3","~G"],[["B[G1]","+∞","−∞","+∞","−f1"],["B[G2]","−∞","+∞","+∞","−f2"],["B[G3]","−∞","−∞","+∞","0"],["~B","−∞","−∞","+∞","+f3"]])}</li>
<li><b>Mixed strategies / invalidity (L3; Hájek §3).</b> Grant every premise. The coin-flip strategy gets EV = ½(∞) + ½(finite) = ∞. So does any act with any positive probability of ending up wagering for God, which (Hájek argues) is every act. Belief is not uniquely best, so the conclusion does not follow: the argument is <i>invalid</i>, not just unsound.</li>
<li><b>Reply: tie-breaker (Hájek §3.3, Schlesinger).</b> Add "maximize the probability of salvation." Hájek: that's a different argument; Pascal's as stated is still invalid.</li>
<li><b>Reply: reformulate (Hájek §4.2, vector-valued value).</b> Give outcomes a pair (earthly value, heavenly value), with salvation = 1 unit of heavenly value, and rank lexicographically: any gain in heavenly expectation beats any earthly gain. Wagering for God has heavenly expectation p; a mixed strategy with probability q of wagering has q·p &lt; p. Now belief uniquely wins, while infinity is replaced with something finite.</li>
<li><b>Premise attacks (Hájek §2):</b> an atheist may give P(God) = 0; infinite utility may be incoherent; God may not reward mercenary believers (James); maximizing EV is questionable (St. Petersburg, infinite variance).</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul>
<li>Stating dominance without "and better in at least one state."</li>
<li>Thinking a 1% chance of God gives a smaller EV than a 50% chance. With ∞ they are equal; that's the point and the problem.</li>
<li>Saying the mixed strategy has lower EV. It doesn't. That's exactly why it breaks the argument.</li>
<li>In the Many Gods table, forgetting ~B gets +∞ under G3 (everyone saved).</li></ul></div>
<div class="sec"><h3>Worked example (slides L1, 14–15)</h3>
${dtable(["Heads (.5)","Tails (.5)"],[["A1: write 'heads'","+$10","−$10"],["A2: write 'tails'","−$7","+$5"]])}
<ol class="steps"><li>Neither act dominates (each is better in one state), so use EV.</li><li>EV[A1] = .5(10) + .5(−10) = 0</li><li>EV[A2] = .5(−7) + .5(5) = −1</li><li>Maximize EV → choose A1.</li></ol></div>`},

ev:{title:"Expected value & utility scales", topic:"ev", src:"Cumulative · slides L1–L5 · HW1–HW4 + keys", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Utility</dt><dd>The philosophical term for the value of an outcome. Slide L4 gives three theories: experience-based (experience machine), objective list, preference-based (advertising worry).</dd>
<dt>Stated preference</dt><dd>What someone says they'd choose. Indifference means equal expected utility; preference means greater.</dd>
<dt>Scale</dt><dd>You may fix two utilities (usually best = 1, worst = 0) and derive the rest. Many correct scales exist (HW2 key 3c).</dd></dl></div>
<div class="sec"><h3>Method</h3><ol>
<li>List each act's outcomes and their probabilities (they sum to 1).</li>
<li>Expected value: multiply and add. Compare acts.</li>
<li>Utility from indifference: write EU[sure thing] = EU[gamble] and solve for the unknown.</li>
<li>Threshold questions ("how high would p need to be?"): write EU[gamble] ≥ EU[sure thing] with p unknown and solve.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul>
<li>Forgetting the cost is lost in the winning state too (raffle: win P − c, lose −c).</li>
<li>Insurance: buying = −cost for sure. Declining = expected loss. Compare those two, not the item values.</li>
<li>Mixing up which outcome is the sure thing in an indifference.</li>
<li>Using EV on money when the question is about utility.</li></ul></div>
<div class="sec"><h3>Worked example (slide L5: Sarah)</h3>
<p>Sarah is indifferent between $5 for sure and a 40% chance at $20 (60% nothing).</p>
<ol class="steps"><li>Fix U($20) = 1, U($0) = 0.</li><li>Indifferent → U($5) = .4·U($20) + .6·U($0) = .4</li><li>Lottery (3): .8 chance $5, .2 chance $20 → .8(.4) + .2(1) = .52</li><li>Lottery (4): .4 chance $20, .5 chance $5, .1 chance $0 → .4(1) + .5(.4) + .1(0) = .60</li><li>(4) has higher expected utility for Sarah.</li></ol></div>
<div class="sec callout"><b>HW4 key correction.</b> Q3a weight-2 struggling artist: .1(6) + .3(8) + .6(4) = <b>5.4</b> (key says 5.2). Q3d: EU<sub>w1</sub> = .9(6.6) + .1(18.4) = <b>7.78</b>; EU<sub>w2</sub> = .9(5.4) + .1(17.8) = <b>6.64</b> (key says 8.44 and 6.98). Recomputed by script.</div>`},

moral:{title:"Moral uncertainty (Oddie)", topic:"moral", src:"8.31–9.04 · slides L4–L6 · Oddie 1994 (scanned PDF, unreadable here: this sheet is from the slides)", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Empirical vs moral uncertainty</dt><dd>Uncertainty about what will happen vs uncertainty about how good or bad the outcomes are morally (slide L5: the sick dog with human-like vs chicken-like moral worth).</dd>
<dt>p</dt><dd>Your probability that embryos have the moral status of adult humans.</dd>
<dt>g</dt><dd>The good from experimenting (the cures developed).</dd>
<dt>l</dt><dd>The disvalue of experimenting on non-consenting adult humans (e.g. Mengele's experiments).</dd></dl></div>
<div class="sec"><h3>The argument (slides L5–L6)</h3>
${dtable(["Embryos have adult moral status (p)","No moral status (1−p)"],[["Experiment","g − l","g"],["Don't experiment","0","0"]])}
<div class="formula">E[Experiment] = p(g − l) + (1−p)g = g − p·l        E[Not] = 0
Experiment just in case  g ≥ p·l</div>
<div class="prem">(1) When facing uncertainty, maximize expected value.<br>(2) Moral uncertainty is like any other.<br>(3) The likelihood that embryos have moral status is a reasonable amount (e.g. 50%, 10%, 1%).<br>(4) The badness of experimenting on non-consenting adult humans is not comparable to the goods one might get from such experiments.<br>(C) So p·l &gt; g: experimenting on embryos is impermissible.</div>
<p><b>Oddie's test case (L5 slide 17):</b> with p = .5, experiment iff 2g ≥ l. Assume a cure for AIDS is as good as a cure for leukemia, and both cures are twice as good as one. Would it be permissible to experiment on non-consenting adults to get both cures? If no, then l &gt; 2g, so it is not permissible to experiment on embryos for the leukemia cure.</p>
<p><b>Simplifying assumptions (slide 18):</b> only two possibilities for moral status; research guaranteed to succeed; ignore monetary cost; the only badness is the experimentation. Claim: each of these is neutral or <i>helps</i> the defender of embryo experimentation, so dropping them only strengthens Oddie.</p></div>
<div class="sec"><h3>Objections and replies</h3>
<p class="small muted">The slides end with "Thoughts?" and don't list objections. These target specific premises; use them as structure, not as "what Peeters said."</p><ol>
<li><b>Against (2):</b> moral uncertainty is not like empirical uncertainty; maybe you should act on the moral view you think is true, not hedge. Reply: in the dog case we do seem to weigh the possibility that killing is seriously wrong.</li>
<li><b>Against (3):</b> p may be tiny. Reply: since l is so large, even p = .01 can make p·l exceed g. The argument only needs p not to be negligible relative to l/g.</li>
<li><b>Against (4):</b> maybe enough cures <i>would</i> outweigh it. Reply: Oddie's test, where most people refuse to experiment on adults even for two cures.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Writing E[Experiment] = p·g − l. Expand properly: p(g − l) + (1−p)g = g − p·l.</li><li>Forgetting that "Don't experiment" is 0 in both states.</li></ul></div>
<div class="sec"><h3>Worked example</h3><p>p = .1, g = 50, l = 1000.</p>
<ol class="steps"><li>E[Experiment] = g − p·l = 50 − .1(1000) = −50</li><li>E[Not] = 0 &gt; −50 → don't experiment.</li><li>Highest p at which experimenting is permissible: g/l = 50/1000 = .05</li></ol></div>`},

qaly:{title:"QALY", topic:"qaly", src:"9.09–9.14 · slides L6–L8 · Singer, McKie, Kuhse & Richardson 1995", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>QALY</dt><dd>Quality-adjusted life year. A year in full health = 1, death = 0, a year in a condition = its quality score.</dd>
<dt>Standard gamble</dt><dd>Live with the condition vs a treatment with p chance of full cure and 1−p chance of painless death. The p at which you're indifferent is the condition's QALY score.</dd>
<dt>Time trade-off</dt><dd>Live 10 years with the condition vs t years in full health. The indifference point gives score t/10.</dd>
<dt>Interval scale</dt><dd>Differences must be meaningful (we compare gains), which is why personal rankings aren't enough (L8).</dd>
<dt>Micro / macro, intra / inter-personal</dt><dd>Uses of QALY: which treatment is best for you; which medication to fund; who gets a scarce heart; which drugs for which diseases to fund (L8 slide 5).</dd>
<dt>Double jeopardy</dt><dd>People with disabling conditions suffer the original tragedy, then a second one: their health care needs are weighed as less important (L8; Harris via Singer et al.).</dd></dl></div>
<div class="sec"><h3>Method</h3><ol>
<li>Get each condition's score (standard gamble or time trade-off).</li>
<li>QALY gained per year = new score − old score.</li>
<li>Over a lifetime: gain per year × years with the condition, plus any extra years × the score you live them at.</li>
<li>Cost per QALY = cost ÷ QALY gained. For annual treatments use cost/year ÷ QALY gained/year.</li>
<li>Prioritize the lowest cost per QALY.</li></ol></div>
<div class="sec"><h3>Double jeopardy: objection and Singer et al.'s replies</h3><ol>
<li><b>Amelioration cases don't produce it.</b> Karen (paraplegic, score .5 → .75 over 40 yrs: +10 QALY for $10,000 = $1,000/QALY) beats Lisa (limp, .95 → 1: +2 QALY = $5,000/QALY). QALYs track the <i>change</i>, not the level.</li>
<li><b>Life-saving cases do produce it:</b> Michelle (score .5) gains 20 QALY from a $100,000 transplant ($5,000/QALY); Nina (.95) gains 38 ($2,632/QALY). But Otto and Richard (shorter vs longer life expectancy) give the same QALY verdict. Harris's view that only the person's desire to live matters would forbid preferring Richard even if Otto had a week to live.</li>
<li><b>Compensatory justice (Kappel and Sandøe's life-time view)</b> says past suffering earns priority. Reply: that would treat someone now suffering less before someone now suffering more. Past suffering can't be reduced, so take the timeless view: reduce present and future suffering.</li>
<li><b>Veil of ignorance:</b> rational egoists who don't know which patient they'll be would choose the method that favours the larger interest in continued life, i.e. QALY allocation. So double jeopardy is not a sign of injustice. (Harris's slavery and Rawls objections are answered in the paper.)</li>
<li>Concession: overall utility (a more compassionate society) might still justify tilting toward the disadvantaged.</li></ol>
<p><b>Adaptation worry (L8 slide 3):</b> people who live with a condition often rate it higher than people imagining it. Should QALY surveys use the general population or people with the condition?</p></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Dividing cost by the condition's score instead of by the QALY <i>gained</i>.</li><li>Forgetting the extra years when a cure also extends life.</li><li>Ranking by highest $/QALY. Lower is better.</li></ul></div>
<div class="sec"><h3>Worked example (slide L8)</h3>
<p>#1 caps teeth: lasts 10 yrs, +.02 QALY/yr, $500. #2 emergency appendectomy: +50 yrs at average .9, $120,000.</p>
<ol class="steps"><li>#1 gain = 10 × .02 = .2 QALY → $500/.2 = $2,500/QALY</li><li>#2 gain = 50 × .9 = 45 QALY → $120,000/45 = $2,666.67/QALY</li><li>QALY maximizing prioritizes capping teeth, narrowly. (A good discussion point.)</li></ol></div>`},

te:{title:"Transformative experience", topic:"te", src:"9.16–9.18 · slides L9–L10 · Pettigrew 2015", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>ETE</dt><dd>Epistemically transformative experience: teaches you what an experience is like, which you can only learn by having it (tasting durian or Vegemite).</dd>
<dt>PTE</dt><dd>Personally transformative experience: changes what you value and how much (becoming a parent, the vampire).</dd>
<dt>Paul's challenge</dt><dd>Decision theory needs step 2 (assign each outcome a utility). With an ETE or PTE you can't, so you can't decide rationally.</dd>
<dt>Redescription strategy</dt><dd>Pettigrew: fine-grain the states to include hypotheses about what your utility function is, then have credences over them.</dd>
<dt>Local / global utility</dt><dd>Local utility = how much you value an outcome at a given time. Global utility = a weighted sum of local utilities across past, present and future.</dd>
<dt>Authenticity</dt><dd>Choosing from your own first-person point of view (Paul). Deferring to others' preferences is the hallmark of inauthentic choice.</dd></dl></div>
<div class="sec"><h3>The problem (slide L10)</h3>
<div class="prem">Step 1: consider each outcome and how likely it is given the action.<br>Step 2: assign each outcome a utility.<br>Step 3: combine into expected utility.<br>ETE: you don't know what the outcome will be like → can't do step 2.<br>PTE: your values will change → which utilities count in step 2?</div>
<p>Slide L9's child-or-not table: the "Have child" row is all ??, so you can't compute EU.</p></div>
<div class="sec"><h3>Pettigrew's responses, with objections</h3><ol>
<li><b>ETE response:</b> uncertainty about your utilities is just more uncertainty, and that's the whole point of decision theory. Use data (slide: 87% of people who didn't grow up eating durian find it disgusting, 10% inoffensive, 3% delicious) as credences over what durian will be like for you, then build the table.</li>
<li><b>Paul's objection, inauthenticity:</b> you're deciding on the basis of other people's preferences.</li>
<li><b>Pettigrew's reply:</b> you use others' reports as <i>evidence about your own</i> utility function, not as values to defer to. If you learned the survey group was unlike you in every other way, you'd drop their numbers. Deferring to morality or a group means using their utility function; this uses your own, just uncertainly.</li>
<li><b>PTE response:</b> map out local utilities at each time, then combine them with weights (summing to 1) into a global utility. That solves the formal problem.</li>
<li><b>The remaining question is which weights.</b> All on present? All on future? Any on the past? If you weight future selves by how similar they are to your present self, you get conservatism and chauvinism about current values (you'd never adopt because your parent-self is unlike you). Second-order utilities don't help, since they change too.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Mixing up ETE and PTE: ETE is about <i>knowing</i> what it's like, PTE is about <i>values changing</i>.</li><li>Weights that don't sum to 1.</li><li>Using the future utility of the outcome you <i>didn't</i> choose: each outcome has its own future utility.</li></ul></div>
<div class="sec"><h3>Worked example (HW4 Q3, corrected)</h3>
<p>Weights .1 past / .6 present / .3 future. Struggling artist: past 6, present 8, future 4. Orchestra teacher: 4, 4, 16. Making it big: 10, 20, 18. Performance career = .9 struggling, .1 big.</p>
<ol class="steps"><li>GU(artist) = .1(6) + .6(8) + .3(4) = 6.6</li><li>GU(teacher) = .1(4) + .6(4) + .3(16) = 7.6</li><li>GU(big) = .1(10) + .6(20) + .3(18) = 18.4</li><li>EU(performance) = .9(6.6) + .1(18.4) = 7.78 &gt; 7.6 → pursue performance on these weights.</li><li>With weights .1/.3/.6: 5.4, 11.2, 17.8; EU(performance) = 6.64 &lt; 11.2 → become the teacher. The weights decide it.</li></ol></div>`},

collective:{title:"Collective action (Kagan)", topic:"collective", src:"9.22–9.25 · slides L11–L13 · Kagan 2011", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Inefficacy / causal impotence</dt><dd>My buying or not buying makes no difference to production.</dd>
<dt>Threshold (triggering) case</dt><dd>Most acts make no difference, but one act tips a threshold and makes a big difference.</dd>
<dt>Imperceptible-difference case</dt><dd>Every act makes a difference too small to perceive.</dd>
<dt>Perfect replacement model</dt><dd>The store orders exactly as many chickens as were sold each day.</dd>
<dt>Batch replacement model</dt><dd>The store orders in batches (100 on Sunday, another 50 only if 50 or fewer are left Thursday).</dd>
<dt>Cohort</dt><dd>Everyone who buys in a period. Kagan: what matters is whether the cohort's size hits a multiple of T, not your place in line.</dd></dl></div>
<div class="sec"><h3>The problem (slide L12)</h3>
<div class="prem">(1) Some practice done by many people has net negative utility (factory farming).<br>(2) So we condemn the practice on consequentialist grounds.<br>(3) But a single individual's action makes no difference to the extent of the practice.<br>(C) So it seems impossible to condemn the individual's action on consequentialist grounds.</div>
<p>Background assumptions (L11): non-human animal suffering matters; benefits are roughly replaceable; eliminating factory farming would be a net positive.</p></div>
<div class="sec"><h3>Kagan's solution</h3><ol>
<li>The batch model is roughly right except in two ways (L12): (a) the size of the cohort vs the last individual; (b) lack of knowledge.</li>
<li>If you <i>know</i> your act won't hit a threshold, there's no consequentialist reason against it. But usually you don't know (L13).</li>
<li>So it's decision under uncertainty. A 1/T chance of triggering an order of T more chickens = an expected one chicken's worth of suffering, which outweighs the small pleasure.</li>
<li>General version (L13): B &gt; n·g; if triggered, effect = T·B/n; Pr = 1/T; so EU = g − B/n &lt; 0. The bigger the threshold, the less likely you trigger it, but the effect grows by the same factor.</li>
<li>Kagan also argues imperceptible-difference cases (for felt harms) can't really exist, so all collective action cases are triggering cases.</li></ol></div>
<div class="sec"><h3>Objections and replies</h3><ol>
<li><b>"Friends of Chicken Consumption":</b> what if someone tells you exactly how many will buy today, so you know you won't trigger? Kagan: then consequentialism doesn't condemn your purchase. But normally that call never comes.</li>
<li><b>Real supply chains are insensitive</b> (waste, many layers). Reply: as long as there is <i>some</i> T and orders track demand, the 1/T × T structure holds.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Saying Kagan thinks every purchase makes a difference. He says most don't; expected disutility is what condemns them.</li><li>Forgetting the knowledge condition.</li></ul></div>
<div class="sec"><h3>Worked example (slide L12 numbers)</h3><p>Chicken life disutility −10, marginal gain of buying +1, T = 25.</p>
<ol class="steps"><li>Pr(you're in a triggering cohort) = 1/25</li><li>If so, 25 more chickens suffer: 25 × (−10) = −250</li><li>EU(buy) = (1/25)(−250) + 1 = −10 + 1 = −9 &lt; 0 → don't buy.</li></ol></div>`},

harms:{title:"Adding harms (Norcross)", topic:"harms", src:"9.30–10.02 · slides L14–L15 · Norcross 1998", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Position 1 (standard consequentialism)</dt><dd>Small harms aggregate: some number of minimal harms is as bad as one tragic harm.</dd>
<dt>Position 2 / "Worse"</dt><dd>Other things equal, it's worse that one person dies than that any number of people suffer moderate headaches.</dd>
<dt>Death</dt><dd>Other things equal, it's better that one person die than that five die (Gas 1).</dd>
<dt>Risk</dt><dd>Other things equal, it's better that one person die than that five million each incur a one-in-a-million risk of dying (Gas 3/4).</dd>
<dt>Headache</dt><dd>It's better that someone incur a one-in-a-million risk of death than suffer a moderate 24-hour headache (driving to the pharmacy).</dd>
<dt>Many Headaches</dt><dd>It's better that five million people each incur a one-in-a-million risk of dying than that they each suffer a headache.</dd></dl></div>
<div class="sec"><h3>The argument (slide L15)</h3>
<div class="prem">(Risk) A single individual suffering a tragic harm is better than a large enough number of individuals each suffering a very small chance of a tragic harm.<br>(Convenience) A single individual suffering a very small chance of a tragic harm is better than that individual suffering a minimal harm.<br>(Multiplication) If Convenience is true, then a large enough number of individuals each suffering a very small chance of a tragic harm is better than that many people each suffering a minimal harm.<br>(C) Standard consequentialism: one person suffering a tragic harm is better than a large enough number of people each suffering a minimal harm.</div>
<p>Many Headaches from Headache (paper): world W (all 5 million stay home) &lt; W1 (one goes) &lt; W2 &lt; … &lt; W5,000,000. By transitivity of "better than," W5,000,000 beats W.</p>
<p><b>Norcross's four options:</b> deny Worse (his choice; also supported by speed-limit cases), deny Risk, deny Headache / Many Headaches, or deny transitivity. Each alternative is worse.</p></div>
<div class="sec"><h3>Objections and replies</h3><ol>
<li><b>Risk is false (L15):</b> with 5 million people at 1-in-a-million risk there's a chance no one dies. Reply: that chance is under 1% (≈ .0067) and there's a fair chance more than five die. Denying Risk means preferring an overwhelming likelihood of many deaths over one certain death just because there's a tiny chance nobody dies. And intuitions about Agnes don't change if she had a 1-in-a-million chance of recovering anyway.</li>
<li><b>Deny Headache:</b> then nearly everyone in the industrialized world is massively irrational (driving to the cinema, the pharmacy).</li>
<li><b>Deny transitivity:</b> discussed in the literature (Temkin, Quinn, Rachels) but "overwhelmingly implausible."</li></ol>
<p>Closing point: philosophers who accept Worse still take small risks of great harms for small benefits, so their behaviour reveals they already deny Worse.</p></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Saying Norcross argues headaches are as bad as death. He argues that <i>enough</i> of them outweigh one death.</li><li>Forgetting the role of transitivity.</li></ul></div>
<div class="sec"><h3>Worked example (Gas 4)</h3><p>5,000,000 people each with a 1/1,000,000 chance of dying, independent.</p>
<ol class="steps"><li>Expected deaths = 5,000,000 × 1/1,000,000 = 5</li><li>Pr(no one dies) = (1 − 1/1,000,000)^5,000,000 ≈ e^−5 ≈ .0067</li><li>So "a chance no one is harmed" is under 1%.</li></ol></div>`},

prob:{title:"Probability rules", topic:"prob", src:"10.02–10.09 · slides L15–L17 · HW5 + key", html:`
<div class="sec"><h3>Peeters' Basic Ideas (L15–L16)</h3><ol>
<li>Pr(A) = # of A possibilities / # of total possibilities. <i>Note: each possibility must be equally likely.</i></li>
<li>Pr(A or B) = Pr(A) + Pr(B). <i>Note: A and B must be exclusive.</i> General rule (L17): Pr(A or B) = Pr(A) + Pr(B) − Pr(A and B).</li>
<li>Pr(A and B) = Pr(A)·Pr(B). <i>Note: A and B must be independent.</i> General rule (L17): Pr(A and B) = Pr(A)·Pr(B|A).</li>
<li>Pr(Guaranteed) = 1.</li><li>Pr(Impossible) = 0.</li></ol>
<p>Derived: Pr(at least one) = 1 − Pr(none), because "all H" and "at least one T" are negations, so exactly one occurs.</p></div>
<div class="sec"><h3>Conditional probability (L16–L17)</h3>
<div class="formula">Pr(A|B) = Pr(A and B) / Pr(B)
Independent iff Pr(A|B) = Pr(A)  (equivalently Pr(A and B) = Pr(A)·Pr(B))</div></div>
<div class="sec"><h3>Common mistakes</h3><ul>
<li>Adding non-exclusive events (spade or face: 13 + 12 double-counts the 3 spade face cards → 22/52, not 25/52).</li>
<li>Multiplying dependent events (draws without replacement, the Sally Clark SIDS deaths).</li>
<li>"At least one in n tries" by adding: use 1 − Pr(none).</li>
<li>Thinking a specific sequence (HHTHH) is less likely than HTHTH. Every specific sequence of 5 fair tosses is 1/32. There are just more sequences with 3 H than with 4 H.</li></ul></div>
<div class="sec"><h3>Worked example (L15)</h3><p>A fair die tossed twice: probability it lands 3 at least once?</p>
<ol class="steps"><li>Pr(no 3 on one toss) = 5/6</li><li>Independent → Pr(no 3 on both) = (5/6)² = 25/36</li><li>Pr(at least one 3) = 1 − 25/36 = 11/36 ≈ .306</li><li>Ten tosses: 1 − (5/6)^10 ≈ .838</li></ol></div>`},

bayes:{title:"Hume, miracles & Bayes", topic:"bayes", src:"10.05–10.12 · slides L16–L19 · Dawid & Gillies 1989", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Miracle</dt><dd>Either an extraordinary occurrence with religious significance, or (Hume) "a transgression of a law of nature by a particular volition of the Deity."</dd>
<dt>Prior Pr(T)</dt><dd>Probability of the theory before the evidence (relative to background knowledge K).</dd>
<dt>Likelihood Pr(E|T)</dt><dd>How likely the evidence is if the theory is true.</dd>
<dt>Posterior Pr(T|E)</dt><dd>Probability of the theory given the evidence. Bayes's theorem computes it.</dd>
<dt>Prosecutor's fallacy</dt><dd>Treating Pr(evidence | innocent) as if it were Pr(innocent | evidence).</dd></dl></div>
<div class="sec"><h3>Hume's argument (slides L16–L17)</h3>
<div class="prem">(1) There are two causal mechanisms behind testimony of a miracle: a miracle occurred (M), or the witnesses lied, were mistaken, exaggerated… (not M).<br>(2) When two mechanisms could explain something, believe the more likely one: believe M only if Pr(M) &gt; Pr(not M).<br>(3) Pr(not M) &gt; Pr(M) always: lying and error happen all the time; a miracle goes against all our evidence.<br>(C) It is basically never reasonable to believe a miracle occurred on the basis of testimony.</div>
<p>Hume's own words: no testimony suffices "unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact which it endeavours to establish."</p></div>
<div class="sec"><h3>Objection and the Bayesian fix</h3><ol>
<li><b>Lottery objection (slide; Price):</b> Pr(typo in the paper) &gt; Pr(those were the winning numbers, 1 in 300 million), so Hume's rule says never believe a lottery report. That's clearly wrong, so Hume's analysis isn't fully correct.</li>
<li><b>Fix:</b> compare posteriors given the testimony, not priors. Use Bayes's theorem.</li>
<li><b>Dawid &amp; Gillies, lottery:</b> p = 10⁻⁶, Pr(a|A) = .8, and Pr(a|not A) is also tiny, since the paper would have to print <i>this particular</i> wrong number: .2 × 10⁻⁶ / (1 − 10⁻⁶). The two tiny numbers cancel → Pr(A|a) = .8.</li>
<li><b>Dawid &amp; Gillies, miracle:</b> p = 10⁻⁶, very reliable witnesses Pr(a|A) = .99, but Pr(a|not A) can't reasonably be below 10⁻³ (fraud, magicians, hallucination). Nothing cancels the tiny prior → Pr(A|a) ≈ 10⁻³. Hume is vindicated.</li>
<li><b>But it depends on background knowledge K:</b> with religious background K′ making p = 10⁻³, the same testimony gives ≈ .5. So testimony can't convert a strict empiricist, but might rationally move someone with a religious worldview (Swinburne, Owen).</li></ol></div>
<div class="sec"><h3>Sally Clark (L18–L19)</h3><ol>
<li>Issue 1: (1/8543)² assumes SIDS deaths are independent. A genetic component makes a second death more likely given a first.</li>
<li>Issue 2 (more important): 1 in 73 million is Pr(2 SIDS deaths), not Pr(innocent | 2 deaths). You must compare it with how rare double murders by mothers are (about 30 of 650,000 children in England and Wales killed by mothers). That's the prosecutor's fallacy.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Confusing Pr(E|T) with Pr(T|E).</li><li>Leaving out the "not T" branch from the denominator.</li><li>Ignoring the base rate (the 1% / 6% / .1%).</li></ul></div>
<div class="sec"><h3>Worked example (L19 breathalyzer)</h3><p>.1% of drivers are drunk; the breathalyzer always flags drunk drivers and wrongly flags 5% of sober ones. A random driver is flagged. Pr(drunk)?</p>
<ol class="steps"><li>T = drunk, E = flagged. Pr(T) = .001, Pr(not T) = .999</li><li>Pr(E|T) = 1, Pr(E|not T) = .05</li><li>Top: 1 × .001 = .001</li><li>Bottom: .001 + .05 × .999 = .001 + .04995 = .05095</li><li>Pr(T|E) = .001/.05095 ≈ .0196 (under 2%)</li></ol></div>`},

doomsday:{title:"Doomsday (Leslie)", topic:"doomsday", src:"10.14–10.16 · Leslie 1996, The End of the World ch. 5, pp. 187–205 · no slides posted yet", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Anthropic principle (Carter)</dt><dd>"What we can expect to observe must be restricted by the conditions necessary for our presence as observers."</dd>
<dt>Observational selection</dt><dd>Observers should expect to find themselves where most observers are (Little Puddle vs London).</dd>
<dt>Doom Soon / Doom Delayed</dt><dd>The two-bin simplification: the human race ends by ~2150, or survives for a few thousand centuries at present population or larger.</dd>
<dt>Bayesian shift</dt><dd>Updating a prior risk estimate using your observed position in time.</dd>
<dt>God's-eye view</dt><dd>Reasoning from facts you don't have ("somebody has to win"). Leslie says probabilities must be estimated from your own evidence.</dd></dl></div>
<div class="sec"><h3>The argument</h3>
<div class="prem">(1) Prefer theories that make your observations fairly expected over ones that make them extraordinary (the cat in the bedroom).<br>(2) If humanity lasts very long and grows, you are extraordinarily early among all humans (perhaps the earliest 0.01%). If it ends soon, you are fairly ordinary: about 10% of all humans ever born are alive now.<br>(3) Your birth rank is relevantly like your name being drawn early from an urn of unknown size.<br>(C) Bayes's rule shifts probability toward Doom Soon: the risk of early extinction is higher than you estimated from other evidence.</div>
<p><b>Leslie's numbers:</b> urn with 10 names (prior 2%) or 1,000 (98%); your name is among the first 3 drawn → posterior ≈ 67%. Doom Soon prior 1%; Pr(being alive now) is 1/10 if soon, 1/1000 if delayed → posterior just over 50%. If delayed means galactic spread (1/1,000,000) → ≈ 99.9%.</p>
<p><b>What it does not claim:</b> it doesn't say we are doomed. It magnifies risk estimates reached by other means (H-bombs, the ozone layer, physics experiments). "A Bayesian shift can magnify a risk-estimate only when something is already there to be magnified." It runs smoothly only if the world is deterministic, or its indeterminism has little effect on how long we last.</p></div>
<div class="sec"><h3>Objections and Leslie's replies</h3><ol>
<li><b>"Somebody has to be early"</b> (God's-eye view). Reply: the lottery winner can reasonably suspect few tickets were sold (the $300 book raffle). Every winner gains reason to think the urn was small, every loser that it was large. Refusing to update would mean learning nothing even after winning 30 times.</li>
<li><b>The Roman objection:</b> a Roman using this argument would have wrongly predicted doom. Replies: (1) so what, since probabilistic arguments mislead someone improbably placed without being bad reasoning; (2) the race ending by 2150 <i>would</i> be fairly soon after Roman times; (3) no population explosion was under way then; (4) Romans may have had a tiny prior for extinction, unlike us.</li>
<li><b>Two-bin approximation is crude.</b> Reply: approximations and ranges still produce big shifts. The real question is whether birth is analogous to being drawn from an urn.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Saying Leslie predicts extinction. He argues for a <i>shift</i>.</li><li>Putting the 1/10 and 1/1000 in as priors. They are likelihoods: Pr(your position | hypothesis).</li></ul></div>
<div class="sec"><h3>Worked example (Leslie pp. 199–200)</h3>
<ol class="steps"><li>T = urn has 10 names. E = your name in the first 3 drawn.</li><li>Pr(T) = .02, Pr(not T) = .98; Pr(E|T) = 3/10, Pr(E|not T) = 3/1000</li><li>Top: .02 × .3 = .006</li><li>Bottom: .006 + .98 × .003 = .00894</li><li>Pr(T|E) = .006/.00894 ≈ .67</li></ol></div>`},
};

/* =========================================================
   CALCULATION GENERATORS — each returns {topic,title,prompt,parts,steps}
   parts: {label, answer, tol?, kind:'num'|'choice', options?}
   ========================================================= */
const GENS = {
ev_raffle:{topic:"ev", name:"Raffle / drawing EV", gen(L){
  const N=pick(L===1?[100,200,500]:[1000,2500,5000,10000]), c=pick([2,5,10,20]), P=pick([100,250,500,1000,2000]);
  const ev=P/N-c;
  return {prompt:`A fundraiser: the first ${N.toLocaleString()} people to donate $${c} go into a fair drawing for a single prize of $${P}. You know you'll be one of them. What is your expected monetary value of donating?`,
    parts:[{label:"EV (in $)",answer:ev,tol:0.006}],
    steps:[`Win: you gain $${P} − $${c} = $${P-c}, with Pr = 1/${N}`,`Lose: −$${c}, with Pr = ${N-1}/${N}`,`EV = (1/${N})(${P-c}) + (${N-1}/${N})(−${c}) = ${P}/${N} − ${c} = ${money(ev)}`]};
}},
ev_breakeven:{topic:"ev", name:"Break-even probability", gen(L){
  const a=ri(2,L===1?10:40), b=ri(2,L===1?10:60); const p=b/(a+b);
  return {prompt:`A gamble: you either win $${a} or lose $${b}. What would your chance of winning need to be for the gamble's expected value to be exactly $0?`,
    parts:[{label:"Pr(win)",answer:p}],
    steps:[`Let p = Pr(win). EV = p(${a}) + (1 − p)(−${b}) = 0`,`${a}p − ${b} + ${b}p = 0 → ${a+b}p = ${b}`,`p = ${b}/${a+b} = ${fp(p)}`]};
}},
ev_insurance:{topic:"ev", name:"Insurance (two items)", gen(L){
  const k1=pick([3,4,5,6]), k2=pick([4,5,6,8,10]); const v1=k1*pick([10,20,30]), v2=k2*pick([30,50,80,100]);
  const loss=v1/k1+v2/k2; const C=Math.max(10,Math.round((loss+pick([-30,-15,15,30]))/5)*5);
  const buy = -C > -loss;
  return {prompt:`You own a phone worth $${v1} and a laptop worth $${v2}. The probability you'll have to replace the phone is 1/${k1}; the laptop, 1/${k2} (independent). A policy costing $${C} covers replacing both.`,
    parts:[{label:"EV of declining (in $)",answer:-loss,tol:0.006},{label:"EV-maximizing choice",kind:"choice",options:["Buy the insurance","Decline the insurance"],answer:buy?0:1}],
    steps:[`EV[buy] = −$${C} (you pay for sure; any loss is covered)`,`EV[decline] = (1/${k1})(−${v1}) + (1/${k2})(−${v2}) = −${f(v1/k1)} − ${f(v2/k2)} = ${money(-loss)}`,`Independence only matters for joint events; expected losses just add.`,`${buy?"−"+C+" > "+money(-loss)+" → buy":money(-loss)+" ≥ −"+C+" → decline"}`]};
}},
ev_twoact:{topic:"ev", name:"Compare two acts", gen(L){
  const s=pick([.1,.2,.25,.3,.4]); const a1=ri(4,12)*10, a2=-ri(1,8)*10, b1=ri(1,6)*10, b2=ri(1,6)*10;
  const A=(1-s)*a1+s*a2, B=(1-s)*b1+s*b2;
  return {prompt:`<p>A vendor decides what to stock for a fair. Pr(rain) = ${s}.</p>`+dtable([`No rain (${f(1-s)})`,`Rain (${s})`],[["A: ice cream",`$${a1}`,`${money(a2)}`],["B: umbrellas + drinks",`$${b1}`,`$${b2}`]])+`<p>Find each act's expected value.</p>`,
    parts:[{label:"EV[A]",answer:A,tol:0.006},{label:"EV[B]",answer:B,tol:0.006},{label:"Rational choice (max EV)",kind:"choice",options:["A","B","Tie"],answer:Math.abs(A-B)<1e-9?2:(A>B?0:1)}],
    steps:[`Check dominance first: A is better if no rain, B if rain → neither dominates.`,`EV[A] = ${f(1-s)}(${a1}) + ${s}(${a2}) = ${f(A)}`,`EV[B] = ${f(1-s)}(${b1}) + ${s}(${b2}) = ${f(B)}`,`Pick the higher EV.`]};
}},
util_indiff:{topic:"ev", name:"Utility from indifference", gen(L){
  const names=pick([["UTM","Western","Queens","York"],["chocolate","vanilla","strawberry","mint"],["Google","Amazon","unemployed","a startup"]]);
  const p=ri(3,8)/10; const uB=L===1?1:pick([.8,.9,1]), uW=L===1?0:pick([0,.2,.3,.5]);
  const mid=p*uB+(1-p)*uW;
  const parts=[{label:`U(${names[1]})`,answer:mid}]; const steps=[`Indifferent → U(${names[1]}) = EU[gamble]`,`= ${p}·U(${names[0]}) + ${f(1-p)}·U(${names[2]}) = ${p}(${uB}) + ${f(1-p)}(${uW}) = ${f(mid)}`];
  let extra="";
  if(L===3){const q=pick([.25,.5,.75,.6]); const y=q*mid+(1-q)*uW; extra=` She is also indifferent between ${names[3]} for sure and a gamble with ${q} chance of ${names[1]} and ${f(1-q)} chance of ${names[2]}.`;
    parts.push({label:`U(${names[3]})`,answer:y}); steps.push(`U(${names[3]}) = ${q}·U(${names[1]}) + ${f(1-q)}·U(${names[2]}) = ${q}(${f(mid)}) + ${f(1-q)}(${uW}) = ${f(y)}`);}
  return {prompt:`Her ranking: ${names[0]} (best) > ${names[1]} > ${names[2]} (worst). U(${names[0]}) = ${uB}, U(${names[2]}) = ${uW}. She is indifferent between ${names[1]} for sure and a gamble with ${p} chance of ${names[0]} and ${f(1-p)} chance of ${names[2]}.${extra}`,parts,steps};
}},
util_solve:{topic:"ev", name:"Solve for an unknown utility", gen(L){
  const T=pick([200,250,300]), M=pick([40,50,60]), pa=pick([.1,.2,.3]), q1=+(pa+.1).toFixed(2), q3=pick([.1,.2]), q2=+(1-q1-q3).toFixed(2), Z=pick([-50,0]);
  const EA=pa*T+(1-pa)*M; const X=(EA-q1*T-q3*Z)/q2;
  const parts=[{label:"EU[School A]",answer:EA},{label:"U(government job)",answer:X,tol:0.02}];
  const steps=[`EU[A] = ${pa}(${T}) + ${f(1-pa)}(${M}) = ${f(EA)}`,`Indifferent → EU[A] = EU[B]: ${f(EA)} = ${q1}(${T}) + ${q2}·U(gov) + ${q3}(${Z})`,`${f(EA)} − ${f(q1*T)} − ${f(q3*Z)} = ${q2}·U(gov) → U(gov) = ${f(EA-q1*T-q3*Z)}/${q2} = ${f(X,2)}`];
  if(L===3){const th=(M-Z)/(T-Z); parts.push({label:"Minimum Pr(law school) to risk the summer program",answer:th}); steps.push(`Summer program: p·${T} + (1−p)(${Z}) ≥ ${M} → p ≥ (${M} − ${Z})/(${T} − ${Z}) = ${fp(th)}`);}
  return {prompt:`Farad wants law school (utility ${T}). At School A, ${Math.round(pa*100)}% of students get into law school and the rest become teachers (utility ${M}). At School B, ${Math.round(q1*100)}% get into law school, ${Math.round(q2*100)}% work for the government, and ${Math.round(q3*100)}% are unemployed (utility ${Z}). He finds A and B equally good.${L===3?` Later he must choose between a sure teaching job (${M}) and a summer program that gets him into law school with probability p, else unemployment (${Z}).`:""}`,parts,steps};
}},
util_threshold:{topic:"ev", name:"Threshold probability", gen(L){
  const s=pick([.4,.5,.6,50,60]), W=s<1?pick([.8,.9,1]):pick([200,250]), F=s<1?pick([0,.1]):pick([0,-50]);
  const p=(s-F)/(W-F);
  return {prompt:`Option 1 is a sure outcome with utility ${s}. Option 2 is a gamble: probability p of an outcome with utility ${W}, otherwise utility ${F}. How high must p be for Option 2 to be at least as good?`,
    parts:[{label:"Minimum p",answer:p}],
    steps:[`EU[gamble] ≥ EU[sure]: p(${W}) + (1−p)(${F}) ≥ ${s}`,`p(${W} − ${F}) ≥ ${s} − ${F}`,`p ≥ ${f(s-F)}/${f(W-F)} = ${fp(p)}`]};
}},
dominance:{topic:"pascal", name:"Dominance check", gen(L){
  const ns=L===1?2:3; const states=["S1","S2","S3"].slice(0,ns);
  const A1=Array.from({length:ns},()=>ri(-5,10)); let A2; const mode=pick(["dom","dom","nodom","equal"]);
  if(mode==="dom"){A2=A1.map(x=>x-pick([0,0,1,2,3])); if(A2.every((x,i)=>x===A1[i])) A2[0]-=2;}
  else if(mode==="nodom"){A2=A1.map(x=>x-pick([1,2])); A2[ri(0,ns-1)]=A1[0]+pick([1,3]); if(A2.every((x,i)=>x<=A1[i])) A2[ns-1]=A1[ns-1]+2;}
  else A2=A1.slice();
  const dom=A1.every((x,i)=>x>=A2[i])&&A1.some((x,i)=>x>A2[i]); const eq=A1.every((x,i)=>x===A2[i]);
  const ans=dom?0:(eq?2:1);
  return {prompt:`<p>Does Act 1 dominate Act 2? (higher = better)</p>`+dtable(states,[["Act 1",...A1],["Act 2",...A2]]),
    parts:[{label:"Verdict",kind:"choice",options:["Yes: Act 1 dominates Act 2","No: Act 2 is better in at least one state","No: they're equal in every state"],answer:ans}],
    steps:[`Dominance: at least as good in every state AND better in some state.`,`Compare column by column: ${states.map((s,i)=>`${s}: ${A1[i]} vs ${A2[i]}`).join("; ")}.`,dom?"Act 1 ≥ Act 2 everywhere and > somewhere → dominates.":eq?"Equal everywhere → no state where Act 1 is better → no dominance.":"Act 2 wins somewhere → no dominance."]};
}},
oddie:{topic:"moral", name:"Oddie's decision rule", gen(L){
  const p=pick([.01,.05,.1,.2,.5]), l=pick([100,500,1000,2000,10000]), g=pick([5,10,20,50,100,300]);
  const e=g-p*l; const parts=[{label:"E[Experiment]",answer:e,tol:0.01},{label:"Permissible to experiment?",kind:"choice",options:["Yes: g ≥ p·l","No: g < p·l"],answer:e>=0?0:1}];
  const steps=[`E[Experiment] = p(g − l) + (1 − p)g = g − p·l = ${g} − ${p}(${l}) = ${f(e)}`,`E[Not] = 0 → experiment iff g ≥ p·l: ${g} ${e>=0?"≥":"<"} ${f(p*l)}`];
  if(L>=2){parts.push({label:"Largest p at which experimenting is permissible",answer:Math.min(1,g/l)}); steps.push(`g ≥ p·l ⇔ p ≤ g/l = ${g}/${l} = ${fp(g/l)}`);}
  return {prompt:`Oddie's table: embryos have adult moral status with probability p = ${p}. The good of the research g = ${g}; the disvalue of experimenting on non-consenting adult humans l = ${l}.`,parts,steps};
}},
qaly_scores:{topic:"qaly", name:"Standard gamble & TTO", gen(L){
  const p=pick([.6,.65,.7,.75,.8,.85,.9,.95]); const t=ri(2,9);
  const c1=pick(["chronic migraines","severe asthma","partial paralysis"]), c2=pick(["blindness","being bedridden","life in a wheelchair"]);
  return {prompt:`Surveys: people are indifferent between living with ${c1} and a treatment with a ${p} chance of full cure and a ${f(1-p)} chance of painless death. They'd also trade 10 years with ${c2} for ${t} years in full health.`,
    parts:[{label:`QALY score of ${c1}`,answer:p},{label:`QALY score of ${c2}`,answer:t/10}],
    steps:[`Standard gamble: indifference at p cure → score = p = ${p}`,`Time trade-off: 10 yrs ≡ ${t} yrs full health → 10·U = ${t}·1 → U = ${t}/10 = ${f(t/10)}`]};
}},
qaly_annual:{topic:"qaly", name:"Cost per QALY (yearly drug)", gen(L){
  const q1=pick([.95,.9,.8,.7]), q2=pick([.65,.6,.5,.4]); const c1=pick([1000,2000,5000]), c2=pick([12000,30000,50000]);
  const r1=c1/(1-q1), r2=c2/(1-q2);
  return {prompt:`Condition #1 has QALY score ${q1}; a yearly drug fully cures it for $${c1.toLocaleString()} per year. Condition #2 has score ${q2}; its yearly cure costs $${c2.toLocaleString()} per year.`,
    parts:[{label:"Cost/QALY for #1 (in $)",answer:r1,tol:Math.max(1,r1*0.005)},{label:"Cost/QALY for #2 (in $)",answer:r2,tol:Math.max(1,r2*0.005)},{label:"QALY-maximizing priority",kind:"choice",options:["Cure #1","Cure #2"],answer:r1<=r2?0:1}],
    steps:[`QALY gained/year: #1 = 1 − ${q1} = ${f(1-q1)}; #2 = 1 − ${q2} = ${f(1-q2)}`,`#1: $${c1}/yr ÷ ${f(1-q1)} QALY/yr = ${money(r1)}/QALY`,`#2: $${c2}/yr ÷ ${f(1-q2)} QALY/yr = ${money(r2)}/QALY`,`Prioritize the lower cost per QALY.`]};
}},
qaly_onetime:{topic:"qaly", name:"One-time cure with life extension", gen(L){
  const q=pick([.4,.5,.6,.65,.8]), Lr=pick([10,20,30,40]), ext=L===1?0:pick([5,10,20]), C=pick([10000,50000,100000,900000]);
  let gained, steps;
  if(L<3){gained=Lr*(1-q)+ext; steps=[`Without cure: ${Lr} yrs at ${q}. With cure: ${Lr+ext} yrs at 1.`,`Gain = ${Lr} × (1 − ${q})${ext?` + ${ext} × 1`:""} = ${f(Lr*(1-q))}${ext?` + ${ext}`:""} = ${f(gained)} QALY`,`Cost/QALY = $${C.toLocaleString()} / ${f(gained)} = ${money(C/gained)}`];
    return {prompt:`People with this condition (score ${q}) live ${Lr} more years on average. A one-time cure costing $${C.toLocaleString()} restores full health${ext?` and extends life to ${Lr+ext} years`:" without changing life expectancy"}.`,parts:[{label:"QALY gained",answer:gained},{label:"Cost per QALY (in $)",answer:C/gained,tol:Math.max(1,C/gained*0.005)}],steps};}
  const q2=+(q+pick([.2,.3])).toFixed(2); const q2c=Math.min(q2,.95); gained=Lr*(q2c-q)+ext*q2c;
  steps=[`Without: ${Lr} yrs at ${q}. With: ${Lr+ext} yrs at ${q2c}.`,`Gain = ${Lr}(${q2c} − ${q}) + ${ext}(${q2c}) = ${f(Lr*(q2c-q))} + ${f(ext*q2c)} = ${f(gained)} QALY`,`Cost/QALY = $${C.toLocaleString()} / ${f(gained)} = ${money(C/gained)}`];
  return {prompt:`People with condition X (score ${q}) live ${Lr} more years. A one-time drug costing $${C.toLocaleString()} raises them to score ${q2c} and extends life to ${Lr+ext} years (partial cure, as in HW3 3d).`,parts:[{label:"QALY gained",answer:gained},{label:"Cost per QALY (in $)",answer:C/gained,tol:Math.max(1,C/gained*0.005)}],steps};
}},
qaly_maxtto:{topic:"qaly", name:"Maximum time trade-off (HW4 2c)", gen(L){
  const B=pick([10000,15000,20000]), C=pick([30000,50000,60000]), Y=pick([30,40,60]);
  const x=C/(Y*B); const tto=10*(1-x);

    parts:[{label:"Minimum QALY gained per year",answer:x,tol:0.0006},{label:"Max TTO (years of full health)",answer:tto,tol:0.02}],
    steps:[`Need $${C}/(${Y}·x) ≤ $${B} → x ≥ ${C}/(${Y}·${B}) = ${fp(x)}`,`Deafness score = 1 − x. TTO: 10·(1 − x) = ${f(tto,2)} years`,`More years traded → higher deafness score → smaller gain → less efficient.`]};

te_global:{topic:"te", name:"Global utility (Pettigrew)", gen(L){
  const W=pick([[.1,.6,.3],[.1,.3,.6],[.2,.5,.3],[0,.5,.5],[.2,.2,.6]]);
  const a=[ri(4,8),ri(6,10),ri(2,6)], b=[ri(2,5),ri(2,5),ri(10,18)];
  const g=v=>W[0]*v[0]+W[1]*v[1]+W[2]*v[2]; const GA=g(a), GB=g(b);
  const parts=[{label:"Global utility: stay an artist",answer:GA},{label:"Global utility: become a teacher",answer:GB}];
  const steps=[`GU = w_past·U_past + w_present·U_present + w_future·U_future`,`Artist: ${W[0]}(${a[0]}) + ${W[1]}(${a[1]}) + ${W[2]}(${a[2]}) = ${f(GA)}`,`Teacher: ${W[0]}(${b[0]}) + ${W[1]}(${b[1]}) + ${W[2]}(${b[2]}) = ${f(GB)}`];
  let extra="";
  if(L===3){const c=[ri(8,12),ri(16,22),ri(14,20)]; const GC=g(c); const pr=pick([.1,.2]); const EU=(1-pr)*GA+pr*GC;
    extra=` Performing is risky: probability ${f(1-pr)} you stay a struggling artist, ${pr} you make it big (local utilities past ${c[0]}, present ${c[1]}, future ${c[2]}).`;
    parts.push({label:"EU of pursuing performance",answer:EU}); steps.push(`GU(big) = ${W[0]}(${c[0]}) + ${W[1]}(${c[1]}) + ${W[2]}(${c[2]}) = ${f(GC)}`,`EU(perform) = ${f(1-pr)}(${f(GA)}) + ${pr}(${f(GC)}) = ${f(EU)}; compare with teacher ${f(GB)}`);}
  return {prompt:`Weights: w_past = ${W[0]}, w_present = ${W[1]}, w_future = ${W[2]}. Struggling artist: past ${a[0]}, present ${a[1]}, future-if-chosen ${a[2]}. Contented teacher: past ${b[0]}, present ${b[1]}, future-if-chosen ${b[2]}.${extra}`,parts,steps};
}},
kagan:{topic:"collective", name:"Kagan's expected utility", gen(L){
  const n=pick([1000,2000,5000]), g=pick([1,2,3]), mult=pick([2,3,5]); const B=n*g*mult; const T=pick([20,25,50,100]);
  const eff=T*B/n, pr=1/T, EU=g-B/n;
  return {prompt:`Slide L13 setup: n = ${n.toLocaleString()} individual acts, each giving its agent a good g = ${g}. Together they cause a bad effect B = ${B.toLocaleString()}. Effects come in thresholds of size T = ${T} acts.`,
    parts:[{label:"Effect if your act triggers a threshold",answer:eff},{label:"Pr(your act triggers it)",answer:pr},{label:"EU of performing the act",answer:EU}],
    steps:[`Check Claim1: B = ${B} > n·g = ${n*g} ✓`,`Effect if triggered = T·B/n = ${T}·${B}/${n} = ${f(eff)}`,`Pr = 1/T = ${fp(pr)}`,`EU = g − (1/T)(T·B/n) = g − B/n = ${g} − ${f(B/n)} = ${f(EU)} < 0`]};
}},
norcross:{topic:"harms", name:"Gas 4: risk spread over many", gen(L){
  const k=pick([1,2,3,4,5,6]); const N=k*1e6; const M=1e6; const p0=Math.pow(1-1/M,N);
  return {prompt:`Gas 4-style: ${N.toLocaleString()} people each face an independent 1-in-1,000,000 risk of death.`,
    parts:[{label:"Expected number of deaths",answer:k},{label:"Pr(no one dies)",answer:p0,tol:p0*0.02}],
    steps:[`Expected deaths = ${N.toLocaleString()} × 1/1,000,000 = ${k}`,`Pr(one person survives) = 1 − 1/1,000,000`,`Independent → Pr(all survive) = (1 − 10⁻⁶)^${N.toLocaleString()} ≈ e^−${k} ≈ ${fp(p0)}`,`So the "chance no one is harmed" objection to Risk rests on a ${(p0*100).toFixed(2)}% chance.`]};
}},
prob_atleast:{topic:"prob", name:"At least once", gen(L){
  const ev=pick([{d:"a fair die lands 6",k:6},{d:"a drawn card (with replacement) is a heart",k:4},{d:"a fair coin lands heads",k:2},{d:"a fair die lands 1 or 2",k:3}]);
  const n=L===1?ri(2,3):ri(4,10); const p=1-Math.pow(1-1/ev.k,n);
  return {prompt:`Over ${n} independent tries, what is the probability that ${ev.d} at least once?`,parts:[{label:"Probability",answer:p}],

}},

prob_seq:{topic:"prob", name:"Coins & independent people", gen(L){

cond_prob:{topic:"prob", name:"Conditional probability & independence", gen(L){
  const A=pick([.3,.4,.5,.6]), B=pick([.2,.4,.5]); const indep=Math.random()<.4; const AB=indep?+(A*B).toFixed(4):+(pick([.1,.15,.2]).toFixed(2));

bayes_test:{topic:"bayes", name:"Bayes: screening test", gen(L){

    parts:[{label:"Pr(condition | positive)",answer:post}],
    steps:[`T = condition, E = positive. Pr(T) = ${b}, Pr(not T) = ${f(1-b)}`,`Pr(E|T) = ${s}, Pr(E|not T) = ${fpr}`,`Top: ${s} × ${b} = ${fp(s*b)}`,`Bottom: ${fp(s*b)} + ${fpr} × ${f(1-b)} = ${fp(s*b+fpr*(1-b))}`,`Pr(T|E) = ${fp(post)}`]};

bayes_urn:{topic:"bayes", name:"Bayes: Laplace's urns", gen(L){

  if(L>=2){parts.push({label:"Pr(two blacks, with replacement, same urn)",answer:pBB}); steps.push(`Pr(BB) = .5(${x}/4)² + .5(${y}/4)² = ${fp(pBB)}`,`Not .5×.5-style: the two draws are dependent because they share an unknown urn.`);}
  return {prompt:`A fair coin picks urn X (${x} black, ${4-x} white) or urn Y (${y} black, ${4-y} white). You draw one marble at random.${L>=2?" Then (separately) imagine drawing twice from the chosen urn, replacing the first marble.":""}`,parts,steps};

hume:{topic:"bayes", name:"Hume: testimony (Dawid–Gillies)", gen(L){
  if(L===3){const N=pick([1e4,1e5,1e6]), r=pick([.7,.8,.9]);
    return {prompt:`Lottery with ${N.toLocaleString()} equally likely numbers. The paper prints the right number with probability ${r}; if wrong, any wrong number is equally likely. Pr(the printed number won | it was printed)?`,
      parts:[{label:"Posterior",answer:r}],steps:[`p = 1/${N.toLocaleString()}; Pr(a|A) = ${r}`,`Pr(a|not A) = (1 − ${r}) × (1/${N.toLocaleString()}) / (1 − p) ≈ ${fp((1-r)/N)}`,`Top: ${r}p; bottom: ${r}p + (1 − ${r})p → posterior = ${r}`,`The tiny prior is cancelled by the tiny chance of printing that specific wrong number. That's why lottery reports are believable and miracles aren't.`]};}
  const p=pick([1e-3,1e-4,1e-6,.01]), ra=pick([.9,.95,.99]), rn=pick([1e-3,1e-2,1e-4]);

  return {prompt:`A reported miracle has prior probability ${p} (relative to background knowledge). Pr(witnesses report it | it happened) = ${ra}; Pr(they report it | it didn't happen) = ${rn}. Probability it happened, given the report?`,

    steps:[`Top: ${ra} × ${p} = ${fp(ra*p)}`,`Bottom: ${fp(ra*p)} + ${rn} × ${f(1-p,6)} = ${fp(ra*p+rn*(1-p))}`,`Pr(M|a) = ${fp(post)}`,post<.5?`Still below .5: Hume's verdict holds with these numbers.`:`Above .5: with this background knowledge the testimony suffices.`]};
}},
doom:{topic:"doomsday", name:"Doomsday: Bayesian shift", gen(L){
  if(Math.random()<.4){const s=pick([.01,.02,.05]), m=10, Mx=pick([1000,10000]), k=3; const post=s*k/m/(s*k/m+(1-s)*k/Mx);
    return {prompt:`Your name is in an urn holding either ${m} names (prior ${s}) or ${Mx.toLocaleString()} names (prior ${f(1-s)}). Your name is among the first ${k} drawn. Probability of the small urn?`,parts:[{label:"Pr(small urn | early draw)",answer:post}],
      steps:[`Likelihoods: ${k}/${m} and ${k}/${Mx}`,`Top: ${s} × ${f(k/m)} = ${fp(s*k/m)}`,`Bottom: ${fp(s*k/m)} + ${f(1-s)} × ${fp(k/Mx)} = ${fp(s*k/m+(1-s)*k/Mx)}`,`Posterior ≈ ${fp(post)}`]};}

}},

LESSONS.sim={title:"Simulation argument (Bostrom)", topic:"sim", src:"10.19 · Bostrom 2003, Are You Living in a Computer Simulation? · no slides posted yet: this sheet is from the reading", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Substrate-independence</dt><dd>Mental states can run on many physical substrates. A computer that replicates a brain's computations in fine enough detail (roughly synapse level) would be conscious. Bostrom takes this as given.</dd>
<dt>Posthuman stage</dt><dd>A civilization that has most of the technology physical law allows, including planet-sized computers.</dd>
<dt>Ancestor-simulation</dt><dd>A simulation of the entire mental history of humankind (or variations). Bostrom estimates it at about 10³³–10³⁶ operations; a planet-mass computer does about 10⁴² per second.</dd>
<dt>f<sub>P</sub>, f<sub>I</sub>, N<sub>I</sub></dt><dd>Fraction of human-level civilizations that reach a posthuman stage; fraction of posthuman civilizations interested in running ancestor-simulations; average number of simulations an interested civilization runs.</dd>
<dt>Bland indifference principle</dt><dd>If a fraction x of observers with human-type experiences are simulated, and you have no information about which kind you are, your credence that you're simulated should be x.</dd></dl></div>
<div class="sec"><h3>The argument</h3>
<div class="formula">f_sim = f_P·N·H / (f_P·N·H + H) = f_P·f_I·N_I / (f_P·f_I·N_I + 1)
(H = average number of people who live before posthumanity; it cancels. N = f_I·N_I.)</div>
<div class="prem">(P1) Substrate-independence: a suitably detailed simulation of a brain would be conscious.<br>(P2) A posthuman civilization could run hugely many ancestor-simulations using a tiny fraction of its computing power, so N<sub>I</sub> is extremely large.<br>(P3) f_sim = f_P·f_I·N_I / (f_P·f_I·N_I + 1).<br>(C1) So at least one is true: (1) f<sub>P</sub> ≈ 0, almost no civilizations reach posthumanity; (2) f<sub>I</sub> ≈ 0, almost no posthuman civilizations run ancestor-simulations; (3) f<sub>sim</sub> ≈ 1, almost all people with our kind of experiences are simulated.<br>(P4) Bland indifference: Cr(SIM | f_sim = x) = x.<br>(C2) If (3) is true, we are almost certainly in a simulation. And unless we are in a simulation now, our descendants will almost certainly never run ancestor-simulations.</div>
<p>Bostrom's own verdict: "it seems sensible to apportion one's credence roughly evenly between (1), (2), and (3)." The conclusion is a <b>disjunction</b>, not "we're simulated."</p></div>
<div class="sec"><h3>Objections and replies (from the paper)</h3><ol>
<li><b>Isn't this the Doomsday argument's indifference principle?</b> Bostrom: no. Doomsday needs a much stronger premise, that you should reason as a random sample from everyone who will ever live even though you know you're in the early 21st century. The bland principle applies only when you have no information about which group you're in.</li>
<li><b>Simulated minds and biological minds have different experiences, so why be indifferent?</b> The junk-DNA analogy: if x% of people carry a sequence S with no observable effects, your credence that you carry S should be x% until you're sequenced, even though everyone's experiences differ.</li>
<li><b>Betting:</b> if everyone bets they're simulated when almost everyone is, almost everyone wins.</li>
<li><b>Deny substrate-independence:</b> Bostrom grants it is "not entirely uncontroversial." It's the premise an objector would target, and he doesn't defend it in this paper.</li>
<li><b>Does (3) mean we should "go crazy"?</b> No: empirical study of our world is still the best guide to how it's set up. The main significance of (3) is its role in the three-way disjunction.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Stating the conclusion as "we are probably in a simulation." It's "at least one of (1), (2), (3)."</li><li>Forgetting f<sub>I</sub>: N = f<sub>I</sub>·N<sub>I</sub>.</li><li>Confusing f<sub>P</sub> (who survives to posthumanity) with f<sub>sim</sub> (who is simulated).</li><li>Treating it as the Doomsday argument: Bostrom explicitly separates them.</li></ul></div>
<div class="sec"><h3>Worked example</h3><p>f<sub>P</sub> = .01, f<sub>I</sub> = .01, N<sub>I</sub> = 1,000,000.</p>
<ol class="steps"><li>f_P·f_I·N_I = .01 × .01 × 1,000,000 = 100</li><li>f_sim = 100 / (100 + 1) = 100/101 ≈ .990</li><li>Bland indifference → Cr(SIM) ≈ .99. Even tiny f<sub>P</sub> and f<sub>I</sub> are swamped when N<sub>I</sub> is huge, which is why one of (1)–(3) must hold.</li></ol></div>`};

LESSONS.boltz={title:"Boltzmann brains", topic:"boltz", src:"10.21–10.23 · Dogramaci & Schoenfield 2024, Why I Am Not a Boltzmann Brain · no slides posted yet: this sheet is from the reading", html:`
<div class="sec"><h3>Key terms</h3><dl>
<dt>Boltzmann Brain (BB)</dt><dd>A brain formed by random fluctuations of particles in a very long-lived universe, radically deceived about its surroundings, possibly with experiences just like yours.</dd>
<dt>Ordinary Observer (OO)</dt><dd>An observer who is not massively deceived about their nearby surroundings.</dd>
<dt>BBU</dt><dd>A Boltzmann Brain Universe: so many BBs that even BBs with your exact experience vastly outnumber OOs.</dd>
<dt>Bayes factor</dt><dd>The ratio of likelihoods Pr(E|BB)/Pr(E|OO). Posterior odds = prior odds × Bayes factor.</dd>
<dt>Egocentric content</dt><dd>Evidence about your own here and now ("here is an apple, now"), not a bare "an apple exists somewhere."</dd>
<dt>Center Indifference (CI)</dt><dd>Elga, Builes: spread credence evenly over all centered worlds (times/places in one world) compatible with your evidence.</dd>
<dt>Confirmation</dt><dd>E confirms H iff Pr(H|E) &gt; Pr(H). Being confirmed is not the same as being made likely, and confirmation is not transitive.</dd></dl></div>
<div class="sec"><h3>The skeptical argument (the two steps)</h3>
<div class="prem">Step 1: Make the ordinary scientific inferences that lead to accepting a BBU model, a universe almost entirely populated by BBs, many with experiences indistinguishable from yours.<br>Step 2: Use indifference reasoning to conclude that, given this model, you're far more likely to be a BB than an OO.<br>(C) So your evidence makes it likely you're a BB (skepticism).</div>
<p>Carroll (2021) rejects Step 1 (accepting a BBU is "cognitively unstable," so its prior must be low). Dogramaci (2020) and this paper reject Step 2.</p></div>
<div class="sec"><h3>Dogramaci &amp; Schoenfield's Bayesian reply</h3>
<div class="formula">Pr(BB|E) / Pr(OO|E)  =  Pr(BB)/Pr(OO)  ×  Pr(E|BB)/Pr(E|OO)
   (posteriors)          (priors)          (Bayes factor)</div><ol>
<li>Assume anti-skeptical priors: Pr(BB) is very low. To get a skeptical posterior the Bayes factor must be huge (priors 1:100 need likelihoods 100:1 to pass 50%).</li>
<li><b>Phenomenal theory of evidence:</b> a BB's experiences are random and unconstrained (it could have any incoherent jumble), while an OO's must be fairly coherent. So any particular coherent experience is less likely for a BB: Pr(E|BB) &lt; Pr(E|OO), and the factor is below 1.</li>
<li><b>Propositional (egocentric) theory:</b> evidence is "here is an apple, this hand, now it's raining…". A BB is overwhelmingly likely to have nothing but empty void around it, so again Pr(E|BB) is far lower.</li>
<li>So even granting that E strongly confirms we live in a BBU, E does <b>not</b> confirm that I'm a BB. Step 2 fails.</li></ol></div>
<div class="sec"><h3>Why the skeptical argument tempts us (their diagnoses)</h3><ol>
<li><b>Treating confirmation as transitive.</b> E confirms BBU, and BBU confirms BB, but E need not confirm BB. Roulette: "1 or 2" confirms "2 or 3," which confirms "3 or 4," but "1 or 2" rules out "3 or 4." Related errors: ignoring part of your total evidence, and confusing "confirmed" with "likely."</li>
<li><b>Center Indifference.</b> CI validates Step 2. But with a plausible premise (Defeat: if I'm a BB my evidence is random, so Pr(H<sub>E</sub>|BB&amp;E) &lt; ½), CI implies Result 1, Pr(H<sub>E</sub>|E) &lt; ½: evidence can never strongly confirm that most brains with my evidence are BBs. Worse, Result 2: Pr(H<sub>E</sub>|E&amp;OO) &lt; ½, even supposing I'm an ordinary observer. That's absurd, so reject CI. It also shows "cognitive instability" (Carroll) isn't the real explanation.</li></ol></div>
<div class="sec"><h3>Common mistakes</h3><ul><li>Thinking D&amp;S deny the physics. They grant E may confirm a BBU; they deny it confirms that <i>I'm</i> a BB.</li><li>Mixing up the hypotheses "I live in a BBU" and "I'm a BB": different likelihoods.</li><li>Multiplying probabilities instead of odds in the odds form of Bayes.</li></ul></div>
<div class="sec"><h3>Worked example (odds form)</h3><p>Prior Pr(BB) = .01. Suppose Pr(E|BB)/Pr(E|OO) = 1/10.</p>
<ol class="steps"><li>Prior odds = .01/.99 = 1/99</li><li>Posterior odds = (1/99) × (1/10) = 1/990</li><li>Pr(BB|E) = 1/(990 + 1) = 1/991 ≈ .0010: the evidence lowered it.</li><li>For Pr(BB|E) &gt; .5 you'd need a Bayes factor &gt; 99 (prior odds 1:99).</li></ol></div>`};

GENS.sim_frac={topic:"sim", name:"Bostrom's f_sim", gen(L){
  const fP=pick([.001,.01,.05,.1]), fI=pick([.001,.01,.1]), NI=pick([1e3,1e4,1e5,1e6]); const k=fP*fI*NI; const fs=k/(k+1);
  const parts=[{label:"f_P·f_I·N_I",answer:k,tol:Math.max(k*.005,1e-6)},{label:"f_sim",answer:fs,tol:Math.max(fs*.005,1e-6)}];
  const steps=[`f_P·f_I·N_I = ${fP} × ${fI} × ${NI.toLocaleString()} = ${fp(k)}`,`f_sim = ${fp(k)} / (${fp(k)} + 1) = ${fp(fs)}`];
  if(L>=2){const x=pick([.9,.99,.999]); const need=x/((1-x)*fP*fI); parts.push({label:`Smallest N_I that makes f_sim ≥ ${x}`,answer:need,tol:need*.01}); steps.push(`f_sim ≥ ${x} ⇔ f_P·f_I·N_I ≥ ${x}/(1 − ${x}) = ${f(x/(1-x))}`,`N_I ≥ ${f(x/(1-x))} / (${fP} × ${fI}) = ${f(need,2)}`);}
  return {prompt:`Bostrom's notation: a fraction f_P = ${fP} of human-level civilizations reach a posthuman stage, a fraction f_I = ${fI} of those are interested in running ancestor-simulations, and each interested civilization runs N_I = ${NI.toLocaleString()} of them on average.${L>=2?" (Then find how large N_I would have to be for the stated f_sim.)":""}`,parts,steps};
}};
GENS.bb_bayes={topic:"boltz", name:"Boltzmann: odds-form Bayes", gen(L){
  const p=pick([.01,.001,.05]); const LR=pick([.1,.5,2,10,100]); const po=p/(1-p); const post=po*LR; const pb=post/(1+post);
  const parts=[{label:"Prior odds Pr(BB)/Pr(OO)",answer:po,tol:po*.01},{label:"Pr(BB|E)",answer:pb,tol:Math.max(pb*.01,1e-6)},{label:"Did E confirm that you're a BB?",kind:"choice",options:["Yes: Pr(BB|E) > Pr(BB)","No: Pr(BB|E) ≤ Pr(BB)"],answer:pb>p?0:1}];
  const steps=[`Prior odds = ${p}/${f(1-p)} = ${fp(po)}`,`Posterior odds = prior odds × Bayes factor = ${fp(po)} × ${LR} = ${fp(post)}`,`Pr(BB|E) = odds/(1 + odds) = ${fp(pb)}`,`Confirmation compares posterior with prior: ${fp(pb)} vs ${p}. Bayes factor ${LR>1?"> 1 → confirms":"< 1 → disconfirms"}.`];
  if(L===3){parts.push({label:"Smallest Bayes factor that makes Pr(BB|E) > .5",answer:(1-p)/p,tol:.01*(1-p)/p}); steps.push(`Need posterior odds > 1 → Bayes factor > 1/prior odds = ${f((1-p)/p)}`);}
  return {prompt:`Your prior that you're a Boltzmann Brain is Pr(BB) = ${p} (and Pr(OO) = ${f(1-p)}). Your total evidence E has Bayes factor Pr(E|BB)/Pr(E|OO) = ${LR}.`,parts,steps};
}};

{t:"sim",d:2,q:"Bostrom's bland indifference principle says…",o:["be indifferent between all hypotheses you lack evidence about","if a fraction x of observers like you are simulated and you have no information about which you are, your credence you're simulated should be x","reason as a random sample from everyone who will ever live","weight past, present and future selves equally"],a:1,e:"Cr(SIM | f_sim = x) = x. He contrasts it with broader (Laplacean) indifference principles and with the Doomsday argument's stronger premise."},

{t:"boltz",d:1,q:"In Dogramaci & Schoenfield, which step of the skeptical argument do they reject?",o:["Step 1: inferring we live in a BBU","Step 2: inferring from the BBU that I'm probably a BB","Neither","Both"],a:1,e:"They side with Dogramaci (2020) against Carroll: even granting E confirms a BBU, E doesn't confirm that I'm a BB."},

function probHTML(P,id,opts={}){

     :`<label class="part"><span>${p.label}</span><input type="text" class="ans" data-pp="${i}" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder=".25 or 1/4" value="${esc(opts.ans&&opts.ans['n'+i]||'')}"></label>`).join('')}</div></div>`;
}
function wireChoices(root,store){$$('.choices button[data-pp]',root).forEach(b=>b.onclick=()=>{if(root.dataset.done)return;const i=b.dataset.pp;$$(`.choices button[data-pp="${i}"]`,root).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(store)store('c'+i,+b.dataset.o);});}
function gradeProb(P,root,mark=true){
  const res=P.parts.map((p,i)=>{
    if(p.kind==='choice'){const s=$(`.choices button.sel[data-pp="${i}"]`,root);const v=s?+s.dataset.o:null;const ok=v===p.answer;
      if(mark)$$(`.choices button[data-pp="${i}"]`,root).forEach(x=>{const o=+x.dataset.o;if(o===p.answer)x.classList.add('right');else if(o===v)x.classList.add('wrong');});
      return {ok,label:p.label,given:v==null?'(none)':p.options[v],ans:p.options[p.answer]};}
    const inp=$(`input[data-pp="${i}"]`,root);const ok=close(parseAns(inp.value),p.answer,p.tol);if(mark){inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');}
    return {ok,label:p.label,given:inp.value||'(blank)',ans:fp(p.answer)};});
  root.dataset.done='1';
  return {res,allOk:res.every(r=>r.ok),frac:res.filter(r=>r.ok).length/res.length};
}

const Q={mode:'adaptive',topic:null,unit:null,level:1,streak:0,cur:null,P:null,answered:false,lastWrong:null,sess:{r:0,w:0},seen:new Set()};
function pool(){let p=BANK; if(Q.mode==='topic'&&Q.topic) p=p.filter(q=>q.t===Q.topic); if(Q.mode==='unit'){const u=UNITS.find(x=>x.wk===Q.unit)||UNITS[UNITS.length-1]; p=p.filter(q=>u.topics.includes(q.t));} return p;}
function pickNext(){
  let p=pool(); if(!p.length) return null;
  if(Q.lastWrong){const lw=Q.lastWrong; if(lw.kind==='calc') return lw; const sim=p.filter(q=>q.t===lw.t&&q.id!==lw.id&&!Q.seen.has(q.id)); if(sim.length){sim.sort((a,b)=>Math.abs(a.d-lw.d)-Math.abs(b.d-lw.d)); const best=sim.filter(q=>q.d===sim[0].d); return pick(best);}}
  let cand=p.filter(q=>!Q.seen.has(q.id)); if(!cand.length){Q.seen.clear();cand=p;}
  const lv=cand.filter(q=>q.d<=Q.level); if(lv.length) cand=lv; const top=cand.filter(q=>q.d===Q.level); if(top.length&&Math.random()<.65) cand=top;
  const w=cand.map(q=>{const s=S.stats[q.t]||{r:0,w:0}; return ((s.w+1)/(s.r+1))*(FOCUS[q.t]||1)*(q.kind==='calc'?0.6:1);});
  let tot=w.reduce((a,b)=>a+b,0),r=Math.random()*tot; for(let i=0;i<cand.length;i++){r-=w[i]; if(r<=0) return cand[i];} return cand[cand.length-1];
}
R.quiz=function(sub){
  if(sub&&TNAME[sub]){Q.mode='topic';Q.topic=sub;Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;}
  if(sub&&/^unit\d+$/.test(sub)){Q.mode='unit';Q.unit=+sub.slice(4);Q.cur=null;Q.lastWrong=null;Q.level=1;Q.streak=0;}
  if(sub==='e2'){Q.mode='adaptive';Q.cur=null;}
  if(!Q.cur){Q.cur=pickNext();Q.answered=false;Q.P=Q.cur&&Q.cur.kind==='calc'?GENS[Q.cur.g].gen(Q.cur.d):null;Q.order=Q.cur&&Q.cur.kind==='mc'?shuffle(Q.cur.m.o.map((_,i)=>i)):null;}
  renderQuiz();
};
